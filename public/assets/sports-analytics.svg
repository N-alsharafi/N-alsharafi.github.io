<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="100%" stop-color="#222" />
      <animate attributeName="x1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
      <animate attributeName="y1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <pattern id="octagonPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 10,2 L 18,10 L 10,18 L 2,10 Z" fill="none" stroke="#0f0" stroke-width="0.2" opacity="0.1" />
    </pattern>
    
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" stroke="#0f0" stroke-width="0.3" opacity="0.1" />
    </pattern>
  </defs>
  
  <!-- Background with grid -->
  <rect width="400" height="400" fill="url(#bgGradient)" />
  <rect width="400" height="400" fill="url(#gridPattern)" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="10s" repeatCount="indefinite" />
  </rect>
  <rect width="400" height="400" fill="url(#octagonPattern)" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="15s" repeatCount="indefinite" />
  </rect>
  
  <!-- Fighting ring -->
  <g transform="translate(200, 200)">
    <!-- Octagon cage -->
    <path d="M -80,0 L -56.56,-56.56 L 0,-80 L 56.56,-56.56 L 80,0 L 56.56,56.56 L 0,80 L -56.56,56.56 Z" 
          fill="none" stroke="#0f0" stroke-width="3" filter="url(#glow)">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </path>
    
    <!-- Center circle -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#0f0" stroke-width="1" stroke-dasharray="5,5">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Fighters -->
  <g>
    <!-- Fighter 1 -->
    <g transform="translate(170, 200)">
      <!-- Stick figure -->
      <circle cx="0" cy="-20" r="8" fill="#f00">
        <animate attributeName="cx" values="0;-2;0;2;0" dur="0.5s" repeatCount="indefinite" />
      </circle>
      <line x1="0" y1="-12" x2="0" y2="0" stroke="#f00" stroke-width="2">
        <animate attributeName="x1" values="0;-2;0;2;0" dur="0.5s" repeatCount="indefinite" />
        <animate attributeName="x2" values="0;-2;0;2;0" dur="0.5s" repeatCount="indefinite" />
      </line>
      <line x1="0" y1="0" x2="-10" y2="15" stroke="#f00" stroke-width="2">
        <animate attributeName="x1" values="0;-2;0;2;0" dur="0.5s" repeatCount="indefinite" />
      </line>
      <line x1="0" y1="0" x2="10" y2="15" stroke="#f00" stroke-width="2">
        <animate attributeName="x1" values="0;-2;0;2;0" dur="0.5s" repeatCount="indefinite" />
      </line>
      <line x1="0" y1="-5" x2="-15" y2="-10" stroke="#f00" stroke-width="2">
        <animate attributeName="x1" values="0;-2;0;2;0" dur="0.5s" repeatCount="indefinite" />
        <animate attributeName="x2" values="-15;-14;-16;-15" dur="0.3s" repeatCount="indefinite" />
      </line>
      <line x1="0" y1="-5" x2="15" y2="-15" stroke="#f00" stroke-width="2">
        <animate attributeName="x1" values="0;-2;0;2;0" dur="0.5s" repeatCount="indefinite" />
        <animate attributeName="x2" values="15;16;14;15" dur="0.3s" repeatCount="indefinite" />
      </line>
      <circle cx="-15" cy="-10" r="3" fill="#f00">
        <animate attributeName="cx" values="-15;-14;-16;-15" dur="0.3s" repeatCount="indefinite" />
      </circle>
      <circle cx="15" cy="-15" r="3" fill="#f00">
        <animate attributeName="cx" values="15;16;14;15" dur="0.3s" repeatCount="indefinite" />
      </circle>
    </g>
    
    <!-- Fighter 2 -->
    <g transform="translate(230, 200)">
      <!-- Stick figure -->
      <circle cx="0" cy="-20" r="8" fill="#00f">
        <animate attributeName="cx" values="0;2;0;-2;0" dur="0.5s" repeatCount="indefinite" />
      </circle>
      <line x1="0" y1="-12" x2="0" y2="0" stroke="#00f" stroke-width="2">
        <animate attributeName="x1" values="0;2;0;-2;0" dur="0.5s" repeatCount="indefinite" />
        <animate attributeName="x2" values="0;2;0;-2;0" dur="0.5s" repeatCount="indefinite" />
      </line>
      <line x1="0" y1="0" x2="-10" y2="15" stroke="#00f" stroke-width="2">
        <animate attributeName="x1" values="0;2;0;-2;0" dur="0.5s" repeatCount="indefinite" />
      </line>
      <line x1="0" y1="0" x2="10" y2="15" stroke="#00f" stroke-width="2">
        <animate attributeName="x1" values="0;2;0;-2;0" dur="0.5s" repeatCount="indefinite" />
      </line>
      <line x1="0" y1="-5" x2="-15" y2="-15" stroke="#00f" stroke-width="2">
        <animate attributeName="x1" values="0;2;0;-2;0" dur="0.5s" repeatCount="indefinite" />
        <animate attributeName="x2" values="-15;-16;-14;-15" dur="0.3s" repeatCount="indefinite" />
      </line>
      <line x1="0" y1="-5" x2="15" y2="-10" stroke="#00f" stroke-width="2">
        <animate attributeName="x1" values="0;2;0;-2;0" dur="0.5s" repeatCount="indefinite" />
        <animate attributeName="x2" values="15;14;16;15" dur="0.3s" repeatCount="indefinite" />
      </line>
      <circle cx="-15" cy="-15" r="3" fill="#00f">
        <animate attributeName="cx" values="-15;-16;-14;-15" dur="0.3s" repeatCount="indefinite" />
      </circle>
      <circle cx="15" cy="-10" r="3" fill="#00f">
        <animate attributeName="cx" values="15;14;16;15" dur="0.3s" repeatCount="indefinite" />
      </circle>
    </g>
    
    <!-- Impact effects -->
    <g transform="translate(200, 190)">
      <!-- Star burst -->
      <g opacity="0" filter="url(#glow)">
        <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="1s" />
        <path d="M 0,0 L 5,10 L 0,5 L -5,10 L 0,0" fill="#ff0" />
        <path d="M 0,0 L 10,5 L 5,0 L 10,-5 L 0,0" fill="#ff0" />
        <path d="M 0,0 L 5,-10 L 0,-5 L -5,-10 L 0,0" fill="#ff0" />
        <path d="M 0,0 L -10,-5 L -5,0 L -10,5 L 0,0" fill="#ff0" />
      </g>
    </g>
  </g>
  
  <!-- Excitement meter -->
  <g transform="translate(60, 200)">
    <rect x="-20" y="-80" width="40" height="160" rx="5" fill="#111" stroke="#0f0" stroke-width="2" filter="url(#glow)">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="8s" repeatCount="indefinite" />
    </rect>
    
    <!-- Meter levels -->
    <rect x="-15" y="0" width="30" height="75" rx="2" fill="#0f0">
      <animate attributeName="height" values="10;75;10" dur="10s" repeatCount="indefinite" />
      <animate attributeName="y" values="65;0;65" dur="10s" repeatCount="indefinite" />
    </rect>
    
    <!-- Level indicators -->
    <line x1="-20" y1="0" x2="-10" y2="0" stroke="#0f0" stroke-width="1" />
    <line x1="-20" y1="-40" x2="-10" y2="-40" stroke="#0f0" stroke-width="1" />
    <line x1="-20" y1="40" x2="-10" y2="40" stroke="#0f0" stroke-width="1" />
    
    <text x="-35" y="-40" font-family="monospace" font-size="10" fill="#0f0" text-anchor="end">HIGH</text>
    <text x="-35" y="0" font-family="monospace" font-size="10" fill="#0f0" text-anchor="end">MED</text>
    <text x="-35" y="40" font-family="monospace" font-size="10" fill="#0f0" text-anchor="end">LOW</text>
    
    <text x="0" y="-90" font-family="monospace" font-size="10" fill="#0f0" text-anchor="middle">EXCITE</text>
  </g>
  
  <!-- Stats -->
  <g transform="translate(340, 150)">
    <rect x="-80" y="-40" width="160" height="80" rx="5" fill="#111" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="8s" repeatCount="indefinite" />
    </rect>
    
    <!-- Stat bars -->
    <text x="-70" y="-25" font-family="monospace" font-size="8" fill="#f00" text-anchor="start">STRIKES:</text>
    <rect x="-70" y="-20" width="36" height="10" fill="#f00" />
    <rect x="-34" y="-20" width="54" height="10" fill="#00f" />
    <text x="30" y="-12" font-family="monospace" font-size="8" fill="#fff" text-anchor="middle">36:54</text>
    
    <text x="-70" y="5" font-family="monospace" font-size="8" fill="#f00" text-anchor="start">KNOCKDOWNS:</text>
    <rect x="-70" y="10" width="20" height="10" fill="#f00" />
    <rect x="-50" y="10" width="10" height="10" fill="#00f" />
    <text x="-30" y="18" font-family="monospace" font-size="8" fill="#fff" text-anchor="middle">2:1</text>
    
    <text x="5" y="5" font-family="monospace" font-size="8" fill="#f00" text-anchor="start">CONTROL:</text>
    <rect x="5" y="10" width="15" height="10" fill="#f00" />
    <rect x="20" y="10" width="35" height="10" fill="#00f" />
    <text x="65" y="18" font-family="monospace" font-size="8" fill="#fff" text-anchor="middle">1:3</text>
    
    <text x="-70" y="30" font-family="monospace" font-size="8" fill="#0f0" text-anchor="start">SCORE: 87</text>
  </g>
  
  <!-- Equation display -->
  <g transform="translate(340, 250)">
    <rect x="-80" y="-30" width="160" height="60" rx="5" fill="#111" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="8s" repeatCount="indefinite" />
    </rect>
    
    <text x="0" y="-10" font-family="monospace" font-size="10" fill="#0f0" text-anchor="middle">EXCITEMENT MODEL</text>
    <text x="0" y="15" font-family="monospace" font-size="12" fill="#0ff" text-anchor="middle" filter="url(#glow)">
      <animate attributeName="fill" values="#0ff;#f0f;#0ff" dur="4s" repeatCount="indefinite" />
      E = 0.4S + 0.3K + 0.2T + 0.1C
    </text>
  </g>
  
  <!-- Animation of data computation -->
  <g transform="translate(340, 320)">
    <rect x="-80" y="-20" width="160" height="40" rx="5" fill="#111" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="8s" repeatCount="indefinite" />
    </rect>
    
    <text x="0" y="5" font-family="monospace" font-size="10" fill="#0f0" text-anchor="middle">
      <animate attributeName="textContent" values="COMPUTING...;ANALYZING...;SCORING...;COMPLETE!;COMPUTING..." dur="4s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#0f0;#ff0;#0f0" dur="4s" repeatCount="indefinite" />
    </text>
  </g>
  
  <!-- Round timer -->
  <g transform="translate(200, 70)">
    <rect x="-40" y="-20" width="80" height="40" rx="5" fill="#111" stroke="#f00" stroke-width="2" filter="url(#glow)">
      <animate attributeName="stroke" values="#f00;#900;#f00" dur="1s" repeatCount="indefinite" />
    </rect>
    
    <text x="0" y="-5" font-family="monospace" font-size="10" fill="#f00" text-anchor="middle">ROUND</text>
    <text x="0" y="15" font-family="monospace" font-size="16" fill="#f00" text-anchor="middle">
      <animate attributeName="textContent" values="3:00;2:45;2:30;2:15;2:00;1:45;1:30;1:15;1:00;0:45;0:30;0:15;0:00" dur="15s" repeatCount="indefinite" />
    </text>
  </g>
  
  <!-- Crowd excitement wave -->
  <g transform="translate(200, 350)">
    <path d="M -150,0 Q -120,-20 -90,0 Q -60,20 -30,0 Q 0,-20 30,0 Q 60,20 90,0 Q 120,-20 150,0" 
          fill="none" stroke="#0f0" stroke-width="1" opacity="0.5" filter="url(#glow)">
      <animate attributeName="d" 
               values="M -150,0 Q -120,-20 -90,0 Q -60,20 -30,0 Q 0,-20 30,0 Q 60,20 90,0 Q 120,-20 150,0;
                       M -150,0 Q -120,20 -90,0 Q -60,-20 -30,0 Q 0,20 30,0 Q 60,-20 90,0 Q 120,20 150,0;
                       M -150,0 Q -120,-20 -90,0 Q -60,20 -30,0 Q 0,-20 30,0 Q 60,20 90,0 Q 120,-20 150,0" 
               dur="5s" repeatCount="indefinite" />
    </path>
  </g>
  
  <!-- Title -->
  <text x="200" y="35" font-family="monospace" font-size="16" fill="#0f0" text-anchor="middle" font-weight="bold" filter="url(#glow)">
    <animate attributeName="fill" values="#0f0;#0ff;#f0f;#0f0" dur="8s" repeatCount="indefinite" />
    UFC FIGHT EXCITEMENT
  </text>
  
  <!-- Retro computer frame -->
  <rect x="10" y="10" width="380" height="380" stroke="#0f0" stroke-width="3" fill="none" rx="5">
    <animate attributeName="stroke" values="#0f0;#00f;#f00;#0f0" dur="8s" repeatCount="indefinite" />
  </rect>
  
  <!-- Scanline effect -->
  <rect width="400" height="2" fill="#fff" opacity="0.1">
    <animate attributeName="y" values="0;400;0" dur="10s" repeatCount="indefinite" />
  </rect>
</svg> 