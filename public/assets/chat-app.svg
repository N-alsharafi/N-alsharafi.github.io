<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="100%" stop-color="#222" />
      <animate attributeName="x1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
      <animate attributeName="y1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <pattern id="gridPattern" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="none" stroke="#0f0" stroke-width="0.5" opacity="0.1" />
      <line x1="0" y1="0" x2="50" y2="50" stroke="#0f0" stroke-width="0.2" opacity="0.1" />
      <line x1="50" y1="0" x2="0" y2="50" stroke="#0f0" stroke-width="0.2" opacity="0.1" />
    </pattern>
    
    <pattern id="circuitPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none" />
      <circle cx="10" cy="10" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="0" cy="0" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="0" cy="20" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="20" cy="0" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="20" cy="20" r="1" fill="#0f0" opacity="0.1" />
    </pattern>
  </defs>
  
  <!-- Background with grid -->
  <rect width="400" height="400" fill="url(#bgGradient)" />
  <rect width="400" height="400" fill="url(#gridPattern)" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="10s" repeatCount="indefinite" />
  </rect>
  <rect width="400" height="400" fill="url(#circuitPattern)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="15s" repeatCount="indefinite" />
  </rect>
  
  <!-- Mobile phone frame -->
  <g transform="translate(200, 200)" filter="url(#glow)">
    <rect x="-80" y="-150" width="160" height="300" rx="20" fill="#333" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="5s" repeatCount="indefinite" />
    </rect>
    
    <!-- Screen -->
    <rect x="-70" y="-140" width="140" height="260" rx="5" fill="#111" stroke="#0f0" stroke-width="1" />
    
    <!-- Home button/indicator -->
    <rect x="-20" y="130" width="40" height="5" rx="2" fill="#0f0">
      <animate attributeName="fill" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    
    <!-- Message bubbles -->
    <!-- Left speech bubble (receiving) -->
    <g>
      <rect x="-65" y="-110" width="90" height="40" rx="10" fill="#222" stroke="#0f0" stroke-width="1">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.5s" fill="freeze" />
      </rect>
      <text x="-20" y="-90" font-family="monospace" font-size="10" fill="#0f0" text-anchor="middle">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.7s" fill="freeze" />
        Hello there!
      </text>
    </g>
    
    <!-- Right speech bubble (sending) -->
    <g>
      <rect x="-25" y="-50" width="90" height="40" rx="10" fill="#004400" stroke="#0f0" stroke-width="1">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.5s" fill="freeze" />
      </rect>
      <text x="20" y="-30" font-family="monospace" font-size="10" fill="#0f0" text-anchor="middle">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.7s" fill="freeze" />
        Hi! How are you?
      </text>
    </g>
    
    <!-- Left speech bubble (receiving) -->
    <g>
      <rect x="-65" y="10" width="100" height="40" rx="10" fill="#222" stroke="#0f0" stroke-width="1">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.5s" fill="freeze" />
      </rect>
      <text x="-15" y="30" font-family="monospace" font-size="10" fill="#0f0" text-anchor="middle">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.7s" fill="freeze" />
        I'm doing great!
      </text>
    </g>
    
    <!-- Right speech bubble (sending) -->
    <g>
      <rect x="-15" y="70" width="80" height="40" rx="10" fill="#004400" stroke="#0f0" stroke-width="1">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.5s" fill="freeze" />
      </rect>
      <text x="25" y="90" font-family="monospace" font-size="10" fill="#0f0" text-anchor="middle">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.7s" fill="freeze" />
        Awesome!
      </text>
    </g>
    
    <!-- Message typing animation -->
    <g transform="translate(-40, 110)">
      <circle cx="0" cy="0" r="3" fill="#0f0">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite" begin="4s" />
      </circle>
      <circle cx="10" cy="0" r="3" fill="#0f0">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite" begin="4.2s" />
      </circle>
      <circle cx="20" cy="0" r="3" fill="#0f0">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite" begin="4.4s" />
      </circle>
    </g>
    
    <!-- Status bar -->
    <rect x="-70" y="-140" width="140" height="20" fill="#222" stroke="#0f0" stroke-width="1" />
    <text x="0" y="-128" font-family="monospace" font-size="8" fill="#0f0" text-anchor="middle">CHAT APP</text>
    
    <!-- Input field -->
    <rect x="-65" y="100" width="130" height="30" rx="5" fill="#222" stroke="#0f0" stroke-width="1" />
    <circle cx="50" cy="115" r="8" fill="#333" stroke="#0f0" stroke-width="1">
      <animate attributeName="fill" values="#333;#004400;#333" dur="2s" repeatCount="indefinite" begin="4s" />
    </circle>
    <text x="50" y="118" font-family="monospace" font-size="10" fill="#0f0" text-anchor="middle">↑</text>
  </g>
  
  <!-- Connection animation -->
  <g>
    <!-- Network signals -->
    <path d="M 70,100 Q 140,140 200,130" fill="none" stroke="#0f0" stroke-width="1" filter="url(#glow)">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" begin="0s" />
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="3s" repeatCount="indefinite" />
    </path>
    
    <path d="M 60,150 Q 130,190 200,180" fill="none" stroke="#0f0" stroke-width="1" filter="url(#glow)">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" begin="1s" />
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="3s" repeatCount="indefinite" />
    </path>
    
    <path d="M 65,200 Q 135,220 200,230" fill="none" stroke="#0f0" stroke-width="1" filter="url(#glow)">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" begin="2s" />
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="3s" repeatCount="indefinite" />
    </path>
    
    <path d="M 330,100 Q 260,140 200,130" fill="none" stroke="#0f0" stroke-width="1" filter="url(#glow)">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" begin="1.5s" />
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="3s" repeatCount="indefinite" />
    </path>
    
    <path d="M 340,150 Q 270,190 200,180" fill="none" stroke="#0f0" stroke-width="1" filter="url(#glow)">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" begin="2.5s" />
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="3s" repeatCount="indefinite" />
    </path>
    
    <path d="M 335,200 Q 265,220 200,230" fill="none" stroke="#0f0" stroke-width="1" filter="url(#glow)">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" begin="3.5s" />
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="3s" repeatCount="indefinite" />
    </path>
  </g>
  
  <!-- Data packets -->
  <g>
    <circle cx="100" cy="130" r="3" fill="#0ff" filter="url(#glow)">
      <animate attributeName="cx" values="100;200" dur="1s" repeatCount="indefinite" begin="0.7s" />
      <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite" begin="0.7s" />
    </circle>
    
    <circle cx="200" cy="180" r="3" fill="#0ff" filter="url(#glow)">
      <animate attributeName="cx" values="200;300" dur="1s" repeatCount="indefinite" begin="1.7s" />
      <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite" begin="1.7s" />
    </circle>
    
    <circle cx="300" cy="130" r="3" fill="#0ff" filter="url(#glow)">
      <animate attributeName="cx" values="300;200" dur="1s" repeatCount="indefinite" begin="2.7s" />
      <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite" begin="2.7s" />
    </circle>
    
    <circle cx="200" cy="230" r="3" fill="#0ff" filter="url(#glow)">
      <animate attributeName="cx" values="200;100" dur="1s" repeatCount="indefinite" begin="3.7s" />
      <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite" begin="3.7s" />
    </circle>
  </g>
  
  <!-- Server side icons -->
  <g transform="translate(70, 130)" filter="url(#glow)">
    <rect x="-25" y="-25" width="50" height="50" rx="5" fill="#333" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="5" font-family="monospace" font-size="10" fill="#0f0" text-anchor="middle">SERVER</text>
  </g>
  
  <g transform="translate(70, 230)" filter="url(#glow)">
    <rect x="-25" y="-25" width="50" height="50" rx="5" fill="#333" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="5" font-family="monospace" font-size="10" fill="#0f0" text-anchor="middle">DB</text>
  </g>
  
  <!-- User icons -->
  <g transform="translate(330, 130)" filter="url(#glow)">
    <circle cx="0" cy="-10" r="15" fill="#333" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="-10" r="5" fill="#0f0">
      <animate attributeName="fill" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </circle>
    <path d="M -10,10 C -10,0 10,0 10,10 C 10,20 -10,20 -10,10 Z" fill="#333" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </path>
  </g>
  
  <g transform="translate(330, 230)" filter="url(#glow)">
    <circle cx="0" cy="-10" r="15" fill="#333" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="-10" r="5" fill="#0f0">
      <animate attributeName="fill" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </circle>
    <path d="M -10,10 C -10,0 10,0 10,10 C 10,20 -10,20 -10,10 Z" fill="#333" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </path>
  </g>
  
  <!-- Title -->
  <text x="200" y="35" font-family="monospace" font-size="16" fill="#0f0" text-anchor="middle" font-weight="bold" filter="url(#glow)">
    <animate attributeName="fill" values="#0f0;#0ff;#f0f;#0f0" dur="8s" repeatCount="indefinite" />
    REAL-TIME CHAT APPLICATION
  </text>
  
  <!-- Retro computer frame -->
  <rect x="10" y="10" width="380" height="380" stroke="#0f0" stroke-width="3" fill="none" rx="5">
    <animate attributeName="stroke" values="#0f0;#00f;#f00;#0f0" dur="8s" repeatCount="indefinite" />
  </rect>
  
  <!-- Scanline effect -->
  <rect width="400" height="2" fill="#fff" opacity="0.1">
    <animate attributeName="y" values="0;400;0" dur="10s" repeatCount="indefinite" />
  </rect>
</svg> 