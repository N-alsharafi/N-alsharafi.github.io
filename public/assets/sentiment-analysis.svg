<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="100%" stop-color="#222" />
      <animate attributeName="x1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
      <animate attributeName="y1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="gridPattern" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="none" stroke="#0f0" stroke-width="0.5" opacity="0.1" />
      <line x1="0" y1="0" x2="50" y2="50" stroke="#0f0" stroke-width="0.2" opacity="0.1" />
      <line x1="50" y1="0" x2="0" y2="50" stroke="#0f0" stroke-width="0.2" opacity="0.1" />
    </pattern>

    <pattern id="circuitPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none" />
      <circle cx="10" cy="10" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="0" cy="0" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="0" cy="20" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="20" cy="0" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="20" cy="20" r="1" fill="#0f0" opacity="0.1" />
    </pattern>
  </defs>

  <!-- Background with grid -->
  <rect width="400" height="400" fill="url(#bgGradient)" />
  <rect width="400" height="400" fill="url(#gridPattern)" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="10s" repeatCount="indefinite" />
  </rect>
  <rect width="400" height="400" fill="url(#circuitPattern)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="15s" repeatCount="indefinite" />
  </rect>

  <!-- Movie reviews input -->
  <g transform="translate(80, 100)">
    <rect x="-60" y="-40" width="120" height="80" rx="5" fill="#333" stroke="#0f0" stroke-width="2" filter="url(#glow)">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="-25" font-family="monospace" font-size="8" fill="#0f0" text-anchor="middle">MOVIE REVIEWS</text>
    <text x="0" y="-10" font-family="monospace" font-size="6" fill="#0f0" text-anchor="middle">50,000 reviews</text>

    <!-- Review samples -->
    <text x="0" y="5" font-family="monospace" font-size="5" fill="#0f0" text-anchor="middle">"Amazing film..."</text>
    <text x="0" y="15" font-family="monospace" font-size="5" fill="#0f0" text-anchor="middle">"Terrible plot..."</text>
    <text x="0" y="25" font-family="monospace" font-size="5" fill="#0f0" text-anchor="middle">"Must watch!"</text>
  </g>

  <!-- ML Models Pipeline -->
  <!-- TF-IDF + Logistic Regression -->
  <g transform="translate(80, 220)" filter="url(#glow)">
    <rect x="-60" y="-30" width="120" height="60" rx="5" fill="#333" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="-15" font-family="monospace" font-size="7" fill="#0f0" text-anchor="middle">TF-IDF</text>
    <text x="0" y="-3" font-family="monospace" font-size="7" fill="#0f0" text-anchor="middle">LOGISTIC REG</text>
    <text x="0" y="15" font-family="monospace" font-size="6" fill="#0f0" text-anchor="middle">
      <animate attributeName="fill" values="#0f0;#ff0;#0f0" dur="2s" repeatCount="indefinite" />
      ACC: 87%
    </text>
  </g>

  <!-- LSTM -->
  <g transform="translate(200, 220)" filter="url(#glow)">
    <rect x="-60" y="-30" width="120" height="60" rx="5" fill="#333" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4.5s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="-15" font-family="monospace" font-size="7" fill="#0f0" text-anchor="middle">LSTM</text>
    <text x="0" y="-3" font-family="monospace" font-size="7" fill="#0f0" text-anchor="middle">NEURAL NET</text>
    <text x="0" y="15" font-family="monospace" font-size="6" fill="#0f0" text-anchor="middle">
      <animate attributeName="fill" values="#0f0;#ff0;#0f0" dur="2s" repeatCount="indefinite" />
      ACC: 88%
    </text>
  </g>

  <!-- BERT -->
  <g transform="translate(320, 220)" filter="url(#glow)">
    <rect x="-60" y="-30" width="120" height="60" rx="5" fill="#333" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="5s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="-15" font-family="monospace" font-size="7" fill="#0f0" text-anchor="middle">BERT</text>
    <text x="0" y="-3" font-family="monospace" font-size="7" fill="#0f0" text-anchor="middle">TRANSFORMER</text>
    <text x="0" y="15" font-family="monospace" font-size="6" fill="#0ff" text-anchor="middle">
      <animate attributeName="fill" values="#0ff;#f0f;#0ff" dur="2s" repeatCount="indefinite" />
      ACC: 90%★
    </text>
  </g>

  <!-- Data flow from input to models -->
  <g>
    <line x1="80" y1="140" x2="80" y2="190" stroke="#0ff" stroke-width="2" stroke-dasharray="5,5" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="10;0" dur="1s" repeatCount="indefinite" />
    </line>
    <line x1="80" y1="140" x2="200" y2="190" stroke="#0ff" stroke-width="2" stroke-dasharray="5,5" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="10;0" dur="1s" repeatCount="indefinite" />
    </line>
    <line x1="80" y1="140" x2="320" y2="190" stroke="#0ff" stroke-width="2" stroke-dasharray="5,5" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="10;0" dur="1s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Data packets flowing -->
  <circle cx="80" cy="140" r="3" fill="#f0f" filter="url(#glow)">
    <animate attributeName="cy" values="140;190" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="80" cy="140" r="3" fill="#ff0" filter="url(#glow)">
    <animate attributeName="cx" values="80;200" dur="2s" repeatCount="indefinite" />
    <animate attributeName="cy" values="140;190" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="80" cy="140" r="3" fill="#0ff" filter="url(#glow)">
    <animate attributeName="cx" values="80;320" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="cy" values="140;190" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0" dur="2.5s" repeatCount="indefinite" />
  </circle>

  <!-- Sentiment Output -->
  <g transform="translate(200, 330)" filter="url(#glow)">
    <rect x="-80" y="-40" width="160" height="80" rx="5" fill="#333" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="-25" font-family="monospace" font-size="8" fill="#0f0" text-anchor="middle">SENTIMENT ANALYSIS</text>

    <!-- Positive/Negative indicators -->
    <g transform="translate(-40, 0)">
      <circle cx="0" cy="0" r="15" fill="#333" stroke="#0f0" stroke-width="2">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="2s" repeatCount="indefinite" />
      </circle>
      <path d="M -8,-3 Q 0,3 8,-3" fill="none" stroke="#0f0" stroke-width="2" />
      <circle cx="-4" cy="-6" r="2" fill="#0f0" />
      <circle cx="4" cy="-6" r="2" fill="#0f0" />
      <text x="0" y="25" font-family="monospace" font-size="6" fill="#0f0" text-anchor="middle">POSITIVE</text>
    </g>

    <g transform="translate(40, 0)">
      <circle cx="0" cy="0" r="15" fill="#333" stroke="#f00" stroke-width="2">
        <animate attributeName="stroke" values="#f00;#ff0;#f00" dur="2s" repeatCount="indefinite" />
      </circle>
      <path d="M -8,3 Q 0,-3 8,3" fill="none" stroke="#f00" stroke-width="2" />
      <circle cx="-4" cy="-6" r="2" fill="#f00" />
      <circle cx="4" cy="-6" r="2" fill="#f00" />
      <text x="0" y="25" font-family="monospace" font-size="6" fill="#f00" text-anchor="middle">NEGATIVE</text>
    </g>
  </g>

  <!-- Results from models to output -->
  <g stroke="#0ff" stroke-width="1" stroke-dasharray="5,5" filter="url(#glow)">
    <line x1="80" y1="250" x2="160" y2="290">
      <animate attributeName="stroke-dashoffset" values="10;0" dur="1s" repeatCount="indefinite" />
    </line>
    <line x1="200" y1="250" x2="200" y2="290">
      <animate attributeName="stroke-dashoffset" values="10;0" dur="1s" repeatCount="indefinite" />
    </line>
    <line x1="320" y1="250" x2="240" y2="290">
      <animate attributeName="stroke-dashoffset" values="10;0" dur="1s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Performance metrics -->
  <g transform="translate(320, 100)" filter="url(#glow)">
    <rect x="-60" y="-40" width="120" height="80" rx="5" fill="#333" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="-25" font-family="monospace" font-size="7" fill="#0f0" text-anchor="middle">PERFORMANCE</text>
    <text x="0" y="-10" font-family="monospace" font-size="6" fill="#0f0" text-anchor="middle">F1-Score: 0.90</text>
    <text x="0" y="0" font-family="monospace" font-size="6" fill="#0f0" text-anchor="middle">
      <animate attributeName="textContent" values="Precision: 0.91;Recall: 0.89;Precision: 0.91" dur="3s" repeatCount="indefinite" />
    </text>

    <!-- Bar chart visualization -->
    <g transform="translate(0, 18)">
      <rect x="-45" y="0" width="12" height="15" fill="#0f0" opacity="0.6">
        <animate attributeName="height" values="10;15;10" dur="2s" repeatCount="indefinite" />
      </rect>
      <rect x="-25" y="0" width="12" height="17" fill="#0f0" opacity="0.6">
        <animate attributeName="height" values="12;17;12" dur="2.2s" repeatCount="indefinite" />
      </rect>
      <rect x="-5" y="0" width="12" height="20" fill="#0ff" opacity="0.8">
        <animate attributeName="height" values="15;20;15" dur="2.4s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- Training data badge -->
  <g transform="translate(200, 50)" filter="url(#glow)">
    <rect x="-50" y="-15" width="100" height="30" rx="15" fill="#333" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="5" font-family="monospace" font-size="8" fill="#0f0" text-anchor="middle">
      <animate attributeName="fill" values="#0f0;#0ff;#0f0" dur="3s" repeatCount="indefinite" />
      IMDB DATASET
    </text>
  </g>

  <!-- Title -->
  <text x="200" y="30" font-family="monospace" font-size="16" fill="#0f0" text-anchor="middle" font-weight="bold" filter="url(#glow)">
    <animate attributeName="fill" values="#0f0;#0ff;#f0f;#0f0" dur="8s" repeatCount="indefinite" />
    SENTIMENT PREDICTION
  </text>

  <!-- Retro computer frame -->
  <rect x="10" y="10" width="380" height="380" stroke="#0f0" stroke-width="3" fill="none" rx="5">
    <animate attributeName="stroke" values="#0f0;#00f;#f00;#0f0" dur="8s" repeatCount="indefinite" />
  </rect>

  <!-- Scanline effect -->
  <rect width="400" height="2" fill="#fff" opacity="0.1">
    <animate attributeName="y" values="0;400;0" dur="10s" repeatCount="indefinite" />
  </rect>
</svg>
