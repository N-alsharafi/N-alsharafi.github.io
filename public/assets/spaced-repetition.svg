<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="100%" stop-color="#222" />
      <animate attributeName="x1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
      <animate attributeName="y1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="gridPattern" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="none" stroke="#0f0" stroke-width="0.5" opacity="0.1" />
      <line x1="0" y1="0" x2="50" y2="50" stroke="#0f0" stroke-width="0.2" opacity="0.1" />
      <line x1="50" y1="0" x2="0" y2="50" stroke="#0f0" stroke-width="0.2" opacity="0.1" />
    </pattern>
    <pattern id="circuitPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none" />
      <circle cx="10" cy="10" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="0" cy="0" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="0" cy="20" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="20" cy="0" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="20" cy="20" r="1" fill="#0f0" opacity="0.1" />
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bgGradient)" />
  <rect width="400" height="400" fill="url(#gridPattern)" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="10s" repeatCount="indefinite" />
  </rect>
  <rect width="400" height="400" fill="url(#circuitPattern)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="15s" repeatCount="indefinite" />
  </rect>
  <g transform="translate(200, 200)">
    <g filter="url(#glow)">
      <circle cx="0" cy="0" r="100" fill="none" stroke="#0f0" stroke-width="2" opacity="0.3" stroke-dasharray="10,5">
        <animate attributeName="stroke-dashoffset" values="0;-15" dur="3s" repeatCount="indefinite" />
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="5s" repeatCount="indefinite" />
      </circle>
      <g transform="translate(0, -80)">
        <rect x="-35" y="-25" width="70" height="50" rx="5" fill="#333" stroke="#0ff" stroke-width="2">
          <animate attributeName="stroke" values="#0ff;#0f0;#0ff" dur="3s" repeatCount="indefinite" />
        </rect>
        <text x="0" y="-5" font-family="monospace" font-size="24" fill="#0ff" text-anchor="middle">&#x1F4A1;</text>
        <text x="0" y="15" font-family="monospace" font-size="7" fill="#0ff" text-anchor="middle">NODE 1</text>
      </g>
      <g transform="rotate(72)" transform-origin="0 0">
        <g transform="translate(0, -80)">
          <rect x="-35" y="-25" width="70" height="50" rx="5" fill="#333" stroke="#ff0" stroke-width="2">
            <animate attributeName="stroke" values="#ff0;#0ff;#ff0" dur="3.2s" repeatCount="indefinite" />
          </rect>
          <text x="0" y="-5" font-family="monospace" font-size="24" fill="#ff0" text-anchor="middle" transform="rotate(-72)">&#x1F4D6;</text>
          <text x="0" y="15" font-family="monospace" font-size="7" fill="#ff0" text-anchor="middle" transform="rotate(-72)">NODE 2</text>
        </g>
      </g>
      <g transform="rotate(144)" transform-origin="0 0">
        <g transform="translate(0, -80)">
          <rect x="-35" y="-25" width="70" height="50" rx="5" fill="#333" stroke="#f0f" stroke-width="2">
            <animate attributeName="stroke" values="#f0f;#ff0;#f0f" dur="3.4s" repeatCount="indefinite" />
          </rect>
          <text x="0" y="-5" font-family="monospace" font-size="24" fill="#f0f" text-anchor="middle" transform="rotate(-144)">&#x1F504;</text>
          <text x="0" y="15" font-family="monospace" font-size="7" fill="#f0f" text-anchor="middle" transform="rotate(-144)">NODE 3</text>
        </g>
      </g>
      <g transform="rotate(216)" transform-origin="0 0">
        <g transform="translate(0, -80)">
          <rect x="-35" y="-25" width="70" height="50" rx="5" fill="#333" stroke="#0f0" stroke-width="2">
            <animate attributeName="stroke" values="#0f0;#f0f;#0f0" dur="3.6s" repeatCount="indefinite" />
          </rect>
          <text x="0" y="-5" font-family="monospace" font-size="24" fill="#0f0" text-anchor="middle" transform="rotate(-216)">&#x2705;</text>
          <text x="0" y="15" font-family="monospace" font-size="7" fill="#0f0" text-anchor="middle" transform="rotate(-216)">NODE 4</text>
        </g>
      </g>
      <g transform="rotate(288)" transform-origin="0 0">
        <g transform="translate(0, -80)">
          <rect x="-35" y="-25" width="70" height="50" rx="5" fill="#333" stroke="#0ff" stroke-width="2">
            <animate attributeName="stroke" values="#0ff;#f0f;#0ff" dur="3.8s" repeatCount="indefinite" />
          </rect>
          <text x="0" y="-5" font-family="monospace" font-size="24" fill="#0ff" text-anchor="middle" transform="rotate(-288)">&#x1F522;</text>
          <text x="0" y="15" font-family="monospace" font-size="7" fill="#0ff" text-anchor="middle" transform="rotate(-288)">NODE 5</text>
        </g>
      </g>
    </g>
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="30" fill="#333" stroke="#0f0" stroke-width="3" filter="url(#glow)">
        <animate attributeName="stroke" values="#0f0;#0ff;#f0f;#0f0" dur="4s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="5" font-family="monospace" font-size="10" fill="#0f0" text-anchor="middle" filter="url(#glow)">FSRS</text>
      <circle cx="0" cy="-100" r="3" fill="#0ff" filter="url(#glow)">
        <animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="5s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="-100" r="3" fill="#f0f" filter="url(#glow)">
        <animateTransform attributeName="transform" type="rotate" values="72 0 0;432 0 0" dur="5s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>
  <g transform="translate(60, 60)" filter="url(#glow)">
    <rect x="-50" y="-25" width="100" height="50" rx="5" fill="#333" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="-10" font-family="monospace" font-size="7" fill="#0f0" text-anchor="middle">INDEXEDDB</text>
    <text x="0" y="0" font-family="monospace" font-size="8" fill="#0f0" text-anchor="middle" font-weight="bold">DEXIE.JS</text>
    <text x="0" y="10" font-family="monospace" font-size="6" fill="#0f0" text-anchor="middle">Offline Storage</text>
  </g>
  <g transform="translate(340, 60)" filter="url(#glow)">
    <rect x="-50" y="-25" width="100" height="50" rx="5" fill="#333" stroke="#0ff" stroke-width="2">
      <animate attributeName="stroke" values="#0ff;#f0f;#0ff" dur="4s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="-10" font-family="monospace" font-size="7" fill="#0ff" text-anchor="middle">PROGRESSIVE</text>
    <text x="0" y="0" font-family="monospace" font-size="8" fill="#0ff" text-anchor="middle" font-weight="bold">PWA</text>
    <text x="0" y="10" font-family="monospace" font-size="6" fill="#0ff" text-anchor="middle">Offline First</text>
  </g>
  <g transform="translate(60, 350)" filter="url(#glow)">
    <rect x="-50" y="-25" width="100" height="50" rx="5" fill="#333" stroke="#f0f" stroke-width="2">
      <animate attributeName="stroke" values="#f0f;#0f0;#f0f" dur="4s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="-10" font-family="monospace" font-size="6" fill="#f0f" text-anchor="middle">MEMORY</text>
    <text x="0" y="0" font-family="monospace" font-size="7" fill="#f0f" text-anchor="middle" font-weight="bold">RETENTION</text>
    <text x="0" y="10" font-family="monospace" font-size="6" fill="#f0f" text-anchor="middle">Optimization</text>
  </g>
  <g transform="translate(340, 350)" filter="url(#glow)">
    <rect x="-50" y="-25" width="100" height="50" rx="5" fill="#333" stroke="#ff0" stroke-width="2">
      <animate attributeName="stroke" values="#ff0;#0ff;#ff0" dur="4s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="-10" font-family="monospace" font-size="7" fill="#ff0" text-anchor="middle">FLASHCARD</text>
    <text x="0" y="0" font-family="monospace" font-size="8" fill="#ff0" text-anchor="middle" font-weight="bold">NODES</text>
    <text x="0" y="10" font-family="monospace" font-size="6" fill="#ff0" text-anchor="middle">Atomic Tracking</text>
  </g>
  <circle cx="110" cy="85" r="2" fill="#0ff" filter="url(#glow)">
    <animate attributeName="cx" values="110;150;200" dur="2s" repeatCount="indefinite" />
    <animate attributeName="cy" values="85;100;120" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="290" cy="85" r="2" fill="#f0f" filter="url(#glow)">
    <animate attributeName="cx" values="290;250;200" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="cy" values="85;100;120" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <text x="200" y="30" font-family="monospace" font-size="16" fill="#0f0" text-anchor="middle" font-weight="bold" filter="url(#glow)">
    <animate attributeName="fill" values="#0f0;#0ff;#f0f;#0f0" dur="8s" repeatCount="indefinite" />
    SPACED REPETITION
  </text>
  <text x="200" y="45" font-family="monospace" font-size="10" fill="#0f0" text-anchor="middle" filter="url(#glow)">
    <animate attributeName="fill" values="#0f0;#0ff;#f0f;#0f0" dur="8s" repeatCount="indefinite" />
    PROGRESSIVE WEB APP
  </text>
  <rect x="10" y="10" width="380" height="380" stroke="#0f0" stroke-width="3" fill="none" rx="5">
    <animate attributeName="stroke" values="#0f0;#00f;#f00;#0f0" dur="8s" repeatCount="indefinite" />
  </rect>
  <rect width="400" height="2" fill="#fff" opacity="0.1">
    <animate attributeName="y" values="0;400;0" dur="10s" repeatCount="indefinite" />
  </rect>
</svg>