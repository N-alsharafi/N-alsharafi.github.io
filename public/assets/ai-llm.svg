<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="100%" stop-color="#222" />
      <animate attributeName="x1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
      <animate attributeName="y1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <pattern id="gridPattern" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="none" stroke="#0f0" stroke-width="0.5" opacity="0.1" />
      <line x1="0" y1="0" x2="50" y2="50" stroke="#0f0" stroke-width="0.2" opacity="0.1" />
      <line x1="50" y1="0" x2="0" y2="50" stroke="#0f0" stroke-width="0.2" opacity="0.1" />
    </pattern>
    
    <pattern id="circuitPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none" />
      <circle cx="10" cy="10" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="0" cy="0" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="0" cy="20" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="20" cy="0" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="20" cy="20" r="1" fill="#0f0" opacity="0.1" />
    </pattern>
  </defs>

  <!-- Background with grid -->
  <rect width="400" height="400" fill="url(#bgGradient)" />
  <rect width="400" height="400" fill="url(#gridPattern)" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="10s" repeatCount="indefinite" />
  </rect>
  <rect width="400" height="400" fill="url(#circuitPattern)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="15s" repeatCount="indefinite" />
  </rect>

  <!-- Brain with connections -->
  <g transform="translate(200, 200)" filter="url(#glow)">
    <ellipse cx="0" cy="0" rx="80" ry="60" fill="#333" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="5s" repeatCount="indefinite" />
    </ellipse>
    
    <!-- Neural connections -->
    <g>
      <line x1="-60" y1="-20" x2="60" y2="20" stroke="#0f0" stroke-width="1" opacity="0.6">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite" />
      </line>
      <line x1="-60" y1="0" x2="60" y2="0" stroke="#0f0" stroke-width="1" opacity="0.6">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.5s" repeatCount="indefinite" />
      </line>
      <line x1="-60" y1="20" x2="60" y2="-20" stroke="#0f0" stroke-width="1" opacity="0.6">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.5s" repeatCount="indefinite" />
      </line>
      <line x1="-40" y1="-40" x2="40" y2="40" stroke="#0f0" stroke-width="1" opacity="0.6">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.8s" repeatCount="indefinite" />
      </line>
      <line x1="40" y1="-40" x2="-40" y2="40" stroke="#0f0" stroke-width="1" opacity="0.6">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.2s" repeatCount="indefinite" />
      </line>
    </g>
    
    <!-- Neurons -->
    <g>
      <circle cx="-60" cy="-20" r="4" fill="#0f0">
        <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" />
        <animate attributeName="fill" values="#0f0;#0ff;#0f0" dur="3s" repeatCount="indefinite" />
      </circle>
      <circle cx="-60" cy="0" r="4" fill="#0f0">
        <animate attributeName="r" values="3;5;3" dur="2.2s" repeatCount="indefinite" />
        <animate attributeName="fill" values="#0f0;#0ff;#0f0" dur="3.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="-60" cy="20" r="4" fill="#0f0">
        <animate attributeName="r" values="3;5;3" dur="2.4s" repeatCount="indefinite" />
        <animate attributeName="fill" values="#0f0;#0ff;#0f0" dur="3.4s" repeatCount="indefinite" />
      </circle>
      <circle cx="-40" cy="-40" r="4" fill="#0f0">
        <animate attributeName="r" values="3;5;3" dur="2.6s" repeatCount="indefinite" />
        <animate attributeName="fill" values="#0f0;#0ff;#0f0" dur="3.6s" repeatCount="indefinite" />
      </circle>
      <circle cx="40" cy="-40" r="4" fill="#0f0">
        <animate attributeName="r" values="3;5;3" dur="2.8s" repeatCount="indefinite" />
        <animate attributeName="fill" values="#0f0;#0ff;#0f0" dur="3.8s" repeatCount="indefinite" />
      </circle>
      <circle cx="60" cy="-20" r="4" fill="#0f0">
        <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite" />
        <animate attributeName="fill" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
      </circle>
      <circle cx="60" cy="0" r="4" fill="#0f0">
        <animate attributeName="r" values="3;5;3" dur="3.2s" repeatCount="indefinite" />
        <animate attributeName="fill" values="#0f0;#0ff;#0f0" dur="4.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="60" cy="20" r="4" fill="#0f0">
        <animate attributeName="r" values="3;5;3" dur="3.4s" repeatCount="indefinite" />
        <animate attributeName="fill" values="#0f0;#0ff;#0f0" dur="4.4s" repeatCount="indefinite" />
      </circle>
      <circle cx="40" cy="40" r="4" fill="#0f0">
        <animate attributeName="r" values="3;5;3" dur="3.6s" repeatCount="indefinite" />
        <animate attributeName="fill" values="#0f0;#0ff;#0f0" dur="4.6s" repeatCount="indefinite" />
      </circle>
      <circle cx="-40" cy="40" r="4" fill="#0f0">
        <animate attributeName="r" values="3;5;3" dur="3.8s" repeatCount="indefinite" />
        <animate attributeName="fill" values="#0f0;#0ff;#0f0" dur="4.8s" repeatCount="indefinite" />
      </circle>
    </g>
    
    <!-- Brain waves -->
    <path d="M -60,0 C -40,-40 -20,40 0,0 C 20,-40 40,40 60,0" fill="none" stroke="#0ff" stroke-width="2" opacity="0.6">
      <animate attributeName="d" values="M -60,0 C -40,-40 -20,40 0,0 C 20,-40 40,40 60,0;M -60,0 C -40,40 -20,-40 0,0 C 20,40 40,-40 60,0;M -60,0 C -40,-40 -20,40 0,0 C 20,-40 40,40 60,0" dur="10s" repeatCount="indefinite" />
    </path>
  </g>
  
  <!-- Text bubbles representing AI responses -->
  <g transform="translate(100, 80)" filter="url(#glow)">
    <rect x="-50" y="-20" width="100" height="40" rx="10" fill="#333" stroke="#0f0" stroke-width="1">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="5" font-family="monospace" font-size="8" text-anchor="middle" fill="#0f0">
      <animate attributeName="fill" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
      CONTEXT AWARE
    </text>
    <path d="M 0,20 L 10,40 L 20,20" fill="#333" stroke="#0f0" stroke-width="1">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </path>
  </g>
  
  <g transform="translate(300, 80)" filter="url(#glow)">
    <rect x="-50" y="-20" width="100" height="40" rx="10" fill="#333" stroke="#0f0" stroke-width="1">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4.5s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="5" font-family="monospace" font-size="8" text-anchor="middle" fill="#0f0">
      <animate attributeName="fill" values="#0f0;#0ff;#0f0" dur="4.5s" repeatCount="indefinite" />
      REASONING ENGINE
    </text>
    <path d="M 0,20 L -10,40 L -20,20" fill="#333" stroke="#0f0" stroke-width="1">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4.5s" repeatCount="indefinite" />
    </path>
  </g>
  
  <g transform="translate(100, 320)" filter="url(#glow)">
    <rect x="-50" y="-20" width="100" height="40" rx="10" fill="#333" stroke="#0f0" stroke-width="1">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="5s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="5" font-family="monospace" font-size="8" text-anchor="middle" fill="#0f0">
      <animate attributeName="fill" values="#0f0;#0ff;#0f0" dur="5s" repeatCount="indefinite" />
      NATURAL LANGUAGE
    </text>
    <path d="M 0,-20 L 10,-40 L 20,-20" fill="#333" stroke="#0f0" stroke-width="1">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="5s" repeatCount="indefinite" />
    </path>
  </g>
  
  <g transform="translate(300, 320)" filter="url(#glow)">
    <rect x="-50" y="-20" width="100" height="40" rx="10" fill="#333" stroke="#0f0" stroke-width="1">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="5.5s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="5" font-family="monospace" font-size="8" text-anchor="middle" fill="#0f0">
      <animate attributeName="fill" values="#0f0;#0ff;#0f0" dur="5.5s" repeatCount="indefinite" />
      TOKEN PREDICTION
    </text>
    <path d="M 0,-20 L -10,-40 L -20,-20" fill="#333" stroke="#0f0" stroke-width="1">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="5.5s" repeatCount="indefinite" />
    </path>
  </g>
  
  <!-- Data flow animation -->
  <g>
    <circle cx="100" cy="100" r="3" fill="#0ff" filter="url(#glow)">
      <animate attributeName="cx" values="100;200;200" dur="3s" repeatCount="indefinite" />
      <animate attributeName="cy" values="100;100;200" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.8;0" dur="3s" repeatCount="indefinite" />
    </circle>
    
    <circle cx="300" cy="100" r="3" fill="#0ff" filter="url(#glow)">
      <animate attributeName="cx" values="300;200;200" dur="3s" repeatCount="indefinite" />
      <animate attributeName="cy" values="100;100;200" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.8;0" dur="3s" repeatCount="indefinite" />
    </circle>
    
    <circle cx="100" cy="300" r="3" fill="#0ff" filter="url(#glow)">
      <animate attributeName="cx" values="100;200;200" dur="3s" repeatCount="indefinite" />
      <animate attributeName="cy" values="300;300;200" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.8;0" dur="3s" repeatCount="indefinite" />
    </circle>
    
    <circle cx="300" cy="300" r="3" fill="#0ff" filter="url(#glow)">
      <animate attributeName="cx" values="300;200;200" dur="3s" repeatCount="indefinite" />
      <animate attributeName="cy" values="300;300;200" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.8;0" dur="3s" repeatCount="indefinite" />
    </circle>
    
    <circle cx="200" cy="200" r="0" fill="#f0f" filter="url(#glow)">
      <animate attributeName="r" values="0;10;0" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Binary data animation -->
  <g transform="translate(200, 35)" filter="url(#glow)">
    <text font-family="monospace" font-size="10" fill="#0f0" text-anchor="middle">
      <animate attributeName="textContent" values="01001000 01100101 01101100 01101100 01101111;10100101 01010101 10101010 10101010 01010101;01001000 01100101 01101100 01101100 01101111" dur="8s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </text>
  </g>
  
  <!-- Top Title -->
  <text x="200" y="35" font-family="monospace" font-size="16" fill="#0f0" text-anchor="middle" font-weight="bold" filter="url(#glow)">
    <animate attributeName="fill" values="#0f0;#0ff;#f0f;#0f0" dur="8s" repeatCount="indefinite" />
    GENERATIVE AI & LLMs
  </text>
  
  <!-- Title at bottom -->
  <text x="200" y="370" font-family="monospace" font-size="16" fill="#0f0" text-anchor="middle" font-weight="bold" filter="url(#glow)">
    <animate attributeName="fill" values="#0f0;#0ff;#f0f;#0f0" dur="8s" repeatCount="indefinite" />
    ARTIFICIAL INTELLIGENCE LLM
  </text>
  
  <!-- Retro computer frame -->
  <rect x="10" y="10" width="380" height="380" stroke="#0f0" stroke-width="3" fill="none" rx="5">
    <animate attributeName="stroke" values="#0f0;#00f;#f00;#0f0" dur="8s" repeatCount="indefinite" />
  </rect>
  
  <!-- Scanline effect -->
  <rect width="400" height="2" fill="#fff" opacity="0.1">
    <animate attributeName="y" values="0;400;0" dur="10s" repeatCount="indefinite" />
  </rect>
</svg> 