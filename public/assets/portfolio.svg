<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="100%" stop-color="#222" />
      <animate attributeName="x1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
      <animate attributeName="y1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none" stroke="#0f0" stroke-width="0.5" opacity="0.2" />
    </pattern>
  </defs>
  
  <!-- Background with grid -->
  <rect width="400" height="400" fill="url(#bgGradient)" />
  <rect width="400" height="400" fill="url(#gridPattern)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="10s" repeatCount="indefinite" />
  </rect>
  
  <!-- Main portfolio interface -->
  <g transform="translate(200, 200)">
    <!-- Rotating outer ring -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="#0f0" stroke-width="1" stroke-dasharray="10 5">
      <animate attributeName="stroke" values="#0f0;#0ff;#f0f;#0f0" dur="10s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="120s" repeatCount="indefinite" />
    </circle>
    
    <!-- Inner display -->
    <circle cx="0" cy="0" r="120" fill="#111" stroke="#0ff" stroke-width="2" opacity="0.9" />
    
    <!-- Project nodes -->
    <g filter="url(#glow)">
      <!-- Node 1: HTML/CSS -->
      <g transform="rotate(0)">
        <line x1="0" y1="0" x2="0" y2="-90" stroke="#0f0" stroke-width="2" opacity="0.6" />
        <circle cx="0" cy="-90" r="15" fill="#0f0">
          <animate attributeName="r" values="15;18;15" dur="3s" repeatCount="indefinite" />
          <animate attributeName="fill" values="#0f0;#0ff;#0f0" dur="5s" repeatCount="indefinite" />
        </circle>
        <text x="0" y="-90" font-family="monospace" font-size="10" fill="#fff" text-anchor="middle" dominant-baseline="middle">HTML</text>
      </g>
      
      <!-- Node 2: JavaScript -->
      <g transform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="-90" stroke="#0f0" stroke-width="2" opacity="0.6" />
        <circle cx="0" cy="-90" r="15" fill="#ff0">
          <animate attributeName="r" values="15;18;15" dur="3s" repeatCount="indefinite" begin="0.5s" />
          <animate attributeName="fill" values="#ff0;#fa0;#ff0" dur="5s" repeatCount="indefinite" />
        </circle>
        <text x="0" y="-90" font-family="monospace" font-size="8" fill="#111" text-anchor="middle" dominant-baseline="middle">JS</text>
      </g>
      
      <!-- Node 3: React -->
      <g transform="rotate(90)">
        <line x1="0" y1="0" x2="0" y2="-90" stroke="#0f0" stroke-width="2" opacity="0.6" />
        <circle cx="0" cy="-90" r="15" fill="#0cf">
          <animate attributeName="r" values="15;18;15" dur="3s" repeatCount="indefinite" begin="1s" />
          <animate attributeName="fill" values="#0cf;#09f;#0cf" dur="5s" repeatCount="indefinite" />
        </circle>
        <text x="0" y="-90" font-family="monospace" font-size="8" fill="#fff" text-anchor="middle" dominant-baseline="middle">REACT</text>
      </g>
      
      <!-- Node 4: Node -->
      <g transform="rotate(135)">
        <line x1="0" y1="0" x2="0" y2="-90" stroke="#0f0" stroke-width="2" opacity="0.6" />
        <circle cx="0" cy="-90" r="15" fill="#0c0">
          <animate attributeName="r" values="15;18;15" dur="3s" repeatCount="indefinite" begin="1.5s" />
          <animate attributeName="fill" values="#0c0;#090;#0c0" dur="5s" repeatCount="indefinite" />
        </circle>
        <text x="0" y="-90" font-family="monospace" font-size="8" fill="#fff" text-anchor="middle" dominant-baseline="middle">NODE</text>
      </g>
      
      <!-- Node 5: Database -->
      <g transform="rotate(180)">
        <line x1="0" y1="0" x2="0" y2="-90" stroke="#0f0" stroke-width="2" opacity="0.6" />
        <circle cx="0" cy="-90" r="15" fill="#f0f">
          <animate attributeName="r" values="15;18;15" dur="3s" repeatCount="indefinite" begin="2s" />
          <animate attributeName="fill" values="#f0f;#c0f;#f0f" dur="5s" repeatCount="indefinite" />
        </circle>
        <text x="0" y="-90" font-family="monospace" font-size="5.5" fill="#fff" text-anchor="middle" dominant-baseline="middle">DATABASE</text>
      </g>
      
      <!-- Node 6: UI/UX -->
      <g transform="rotate(225)">
        <line x1="0" y1="0" x2="0" y2="-90" stroke="#0f0" stroke-width="2" opacity="0.6" />
        <circle cx="0" cy="-90" r="15" fill="#f55">
          <animate attributeName="r" values="15;18;15" dur="3s" repeatCount="indefinite" begin="2.5s" />
          <animate attributeName="fill" values="#f55;#f33;#f55" dur="5s" repeatCount="indefinite" />
        </circle>
        <text x="0" y="-90" font-family="monospace" font-size="8" fill="#fff" text-anchor="middle" dominant-baseline="middle">UI/UX</text>
      </g>
      
      <!-- Node 7: SEO -->
      <g transform="rotate(270)">
        <line x1="0" y1="0" x2="0" y2="-90" stroke="#0f0" stroke-width="2" opacity="0.6" />
        <circle cx="0" cy="-90" r="15" fill="#fc0">
          <animate attributeName="r" values="15;18;15" dur="3s" repeatCount="indefinite" begin="3s" />
          <animate attributeName="fill" values="#fc0;#f90;#fc0" dur="5s" repeatCount="indefinite" />
        </circle>
        <text x="0" y="-90" font-family="monospace" font-size="8" fill="#111" text-anchor="middle" dominant-baseline="middle">SEO</text>
      </g>
      
      <!-- Node 8: API -->
      <g transform="rotate(315)">
        <line x1="0" y1="0" x2="0" y2="-90" stroke="#0f0" stroke-width="2" opacity="0.6" />
        <circle cx="0" cy="-90" r="15" fill="#0ff">
          <animate attributeName="r" values="15;18;15" dur="3s" repeatCount="indefinite" begin="3.5s" />
          <animate attributeName="fill" values="#0ff;#09f;#0ff" dur="5s" repeatCount="indefinite" />
        </circle>
        <text x="0" y="-90" font-family="monospace" font-size="8" fill="#111" text-anchor="middle" dominant-baseline="middle">API</text>
      </g>
    </g>
    
    <!-- Central Hub -->
    <circle cx="0" cy="0" r="40" fill="#0f0" opacity="0.2">
      <animate attributeName="r" values="40;45;40" dur="5s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#0f0;#0ff;#f0f;#0f0" dur="10s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.3;0.2" dur="5s" repeatCount="indefinite" />
    </circle>
    
    <circle cx="0" cy="0" r="30" fill="#0f0" opacity="0.4">
      <animate attributeName="r" values="30;35;30" dur="5s" repeatCount="indefinite" begin="0.5s" />
      <animate attributeName="fill" values="#0f0;#0ff;#f0f;#0f0" dur="10s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0.5;0.4" dur="5s" repeatCount="indefinite" />
    </circle>
    
    <circle cx="0" cy="0" r="20" fill="#fff" opacity="0.9">
      <animate attributeName="r" values="20;22;20" dur="5s" repeatCount="indefinite" begin="1s" />
      <animate attributeName="opacity" values="0.8;1;0.8" dur="5s" repeatCount="indefinite" />
    </circle>
    
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#000" text-anchor="middle" dominant-baseline="middle" font-weight="bold">PORTFOLIO</text>
    <text x="0" y="12" font-family="monospace" font-size="8" fill="#000" text-anchor="middle" dominant-baseline="middle">PROJECTS</text>
  </g>
  
  <!-- Floating code snippets -->
  <g opacity="0.7">
    <text x="30" y="30" font-family="monospace" font-size="8" fill="#0f0">
      <animate attributeName="textContent" values="<div>;  <header>;    <nav>;    </nav>;  </header>;<div>;" dur="8s" repeatCount="indefinite" />
    </text>
    
    <text x="330" y="40" font-family="monospace" font-size="8" fill="#0ff" text-anchor="end">
      <animate attributeName="textContent" values="function App() {;  return (;    <Portfolio />;  );};export default App;" dur="10s" repeatCount="indefinite" />
    </text>
    
    <text x="50" y="370" font-family="monospace" font-size="8" fill="#f0f">
      <animate attributeName="textContent" values=".portfolio {;  display: grid;  grid-template: auto;  gap: 2rem;}" dur="7s" repeatCount="indefinite" />
    </text>
    
    <text x="330" y="360" font-family="monospace" font-size="8" fill="#ff0" text-anchor="end">
      <animate attributeName="textContent" values="const [projects, setProjects];useState([]);useEffect(() => {;  fetchProjects();}, []);" dur="9s" repeatCount="indefinite" />
    </text>
  </g>
  
  <!-- Scanline effect -->
  <rect width="400" height="2" fill="#fff" opacity="0.1">
    <animate attributeName="y" values="0;400;0" dur="10s" repeatCount="indefinite" />
  </rect>
  
  <!-- Title -->
  <text x="200" y="30" font-family="monospace" font-size="20" fill="#0f0" text-anchor="middle" font-weight="bold" filter="url(#glow)">
    <animate attributeName="fill" values="#0f0;#0ff;#f0f;#0f0" dur="8s" repeatCount="indefinite" />
    PORTFOLIO PROJECT
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="50" font-family="monospace" font-size="12" fill="#0ff" text-anchor="middle" opacity="0.8">
    <animate attributeName="fill" values="#0ff;#0f0;#0ff" dur="8s" repeatCount="indefinite" />
    Web Development Showcase
  </text>
  
  <!-- Retro frame -->
  <rect x="10" y="10" width="380" height="380" stroke="#0f0" stroke-width="3" fill="none" rx="5">
    <animate attributeName="stroke" values="#0f0;#0ff;#f0f;#0f0" dur="8s" repeatCount="indefinite" />
  </rect>
</svg> 