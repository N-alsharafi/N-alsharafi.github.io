<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="100%" stop-color="#222" />
      <animate attributeName="x1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
      <animate attributeName="y1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="gridPattern" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="none" stroke="#0f0" stroke-width="0.5" opacity="0.1" />
      <line x1="0" y1="0" x2="50" y2="50" stroke="#0f0" stroke-width="0.2" opacity="0.1" />
      <line x1="50" y1="0" x2="0" y2="50" stroke="#0f0" stroke-width="0.2" opacity="0.1" />
    </pattern>
    <pattern id="circuitPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none" />
      <circle cx="10" cy="10" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="0" cy="0" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="0" cy="20" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="20" cy="0" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="20" cy="20" r="1" fill="#0f0" opacity="0.1" />
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bgGradient)" />
  <rect width="400" height="400" fill="url(#gridPattern)" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="10s" repeatCount="indefinite" />
  </rect>
  <rect width="400" height="400" fill="url(#circuitPattern)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="15s" repeatCount="indefinite" />
  </rect>
  <g transform="translate(200, 130)">
    <g filter="url(#glow)">
      <rect x="-130" y="-40" width="120" height="80" rx="5" fill="#333" stroke="#0ff" stroke-width="2">
        <animate attributeName="stroke" values="#0ff;#0f0;#0ff" dur="3s" repeatCount="indefinite" />
      </rect>
      <text x="-70" y="-25" font-family="monospace" font-size="7" fill="#0ff" text-anchor="middle">HUMAN CODE</text>
      <text x="-70" y="-15" font-family="monospace" font-size="6" fill="#0ff" text-anchor="middle">50 samples</text>
      <text x="-70" y="10" font-family="monospace" font-size="24" fill="#0ff" text-anchor="middle">&#x1F468;</text>
      <rect x="-120" y="25" width="100" height="12" rx="2" fill="#222" stroke="#0ff" stroke-width="1">
        <animate attributeName="stroke" values="#0ff;#0f0;#0ff" dur="3s" repeatCount="indefinite" />
      </rect>
      <rect x="-120" y="25" width="70" height="12" rx="2" fill="#0ff" opacity="0.3">
        <animate attributeName="width" values="70;75;70" dur="2s" repeatCount="indefinite" />
      </rect>
      <text x="10" y="-25" font-family="monospace" font-size="7" fill="#f0f" text-anchor="middle">AI CODE</text>
      <text x="10" y="-15" font-family="monospace" font-size="6" fill="#f0f" text-anchor="middle">50 samples</text>
      <text x="10" y="10" font-family="monospace" font-size="24" fill="#f0f" text-anchor="middle">&#x1F916;</text>
      <rect x="-10" y="25" width="100" height="12" rx="2" fill="#222" stroke="#f0f" stroke-width="1">
        <animate attributeName="stroke" values="#f0f;#0ff;#f0f" dur="3s" repeatCount="indefinite" />
      </rect>
      <rect x="-10" y="25" width="55" height="12" rx="2" fill="#f0f" opacity="0.3">
        <animate attributeName="width" values="55;60;55" dur="2.5s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
  <g transform="translate(200, 250)" filter="url(#glow)">
    <rect x="-130" y="-35" width="260" height="70" rx="5" fill="#333" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#ff0;#0f0" dur="3s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="-20" font-family="monospace" font-size="8" fill="#0f0" text-anchor="middle">TAXONOMY-GUIDED TESTING PIPELINE</text>
    <rect x="-115" y="-10" width="70" height="20" rx="3" fill="#222" stroke="#0f0" stroke-width="1">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="3s" repeatCount="indefinite" />
    </rect>
    <text x="-80" y="5" font-family="monospace" font-size="6" fill="#0f0" text-anchor="middle">Runtime</text>
    <rect x="-35" y="-10" width="70" height="20" rx="3" fill="#222" stroke="#0f0" stroke-width="1">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="3s" repeatCount="indefinite" begin="0.3s" />
    </rect>
    <text x="0" y="5" font-family="monospace" font-size="6" fill="#0f0" text-anchor="middle">Defect</text>
    <rect x="45" y="-10" width="70" height="20" rx="3" fill="#222" stroke="#0f0" stroke-width="1">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="3s" repeatCount="indefinite" begin="0.6s" />
    </rect>
    <text x="80" y="5" font-family="monospace" font-size="6" fill="#0f0" text-anchor="middle">Coverage</text>
    <text x="0" y="25" font-family="monospace" font-size="6" fill="#0f0" text-anchor="middle">Test Suite Sufficiency Analysis</text>
  </g>
  <g transform="translate(200, 340)" filter="url(#glow)">
    <rect x="-130" y="-25" width="260" height="50" rx="5" fill="#333" stroke="#ff0" stroke-width="2">
      <animate attributeName="stroke" values="#ff0;#0f0;#ff0" dur="4s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="-10" font-family="monospace" font-size="7" fill="#ff0" text-anchor="middle">KEY FINDINGS</text>
    <text x="0" y="5" font-family="monospace" font-size="6" fill="#ff0" text-anchor="middle">Legacy test suites need strategic adaptation for AI-generated code</text>
  </g>
  <line x1="200" y1="170" x2="200" y2="215" stroke="#0f0" stroke-width="2" filter="url(#glow)" stroke-dasharray="4,2">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" />
  </line>
  <line x1="200" y1="285" x2="200" y2="315" stroke="#0ff" stroke-width="2" filter="url(#glow)" stroke-dasharray="4,2">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.5s" />
  </line>
  <circle cx="200" cy="190" r="3" fill="#0ff" filter="url(#glow)">
    <animate attributeName="cy" values="170;215" dur="1s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite" />
  </circle>
  <circle cx="200" cy="300" r="3" fill="#f0f" filter="url(#glow)">
    <animate attributeName="cy" values="285;315" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <text x="200" y="30" font-family="monospace" font-size="16" fill="#f0f" text-anchor="middle" font-weight="bold" filter="url(#glow)">
    <animate attributeName="fill" values="#f0f;#0ff;#f0f" dur="8s" repeatCount="indefinite" />
    AI vs HUMAN CODE ANALYSIS
  </text>
  <text x="200" y="45" font-family="monospace" font-size="10" fill="#f0f" text-anchor="middle" filter="url(#glow)">
    <animate attributeName="fill" values="#f0f;#0ff;#f0f" dur="8s" repeatCount="indefinite" />
    SOFTWARE RELIABILITY STUDY
  </text>
  <rect x="10" y="10" width="380" height="380" stroke="#f0f" stroke-width="3" fill="none" rx="5">
    <animate attributeName="stroke" values="#f0f;#00f;#f00;#f0f" dur="8s" repeatCount="indefinite" />
  </rect>
  <rect width="400" height="2" fill="#fff" opacity="0.1">
    <animate attributeName="y" values="0;400;0" dur="10s" repeatCount="indefinite" />
  </rect>
</svg>