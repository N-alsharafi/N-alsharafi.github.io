<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuh Al-Sharafi - Experience</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <a href="/" class="navigationBar">Profile</a>
        <a href="/experience.html" class="navigationBar">Experience</a>
        <a href="/contact.html" class="navigationBar">Contact</a>
    </header>
    <main>
        <p class="experience-nav">
            <a href="#" id="projects-link" class="navigationBar"> Projects </a> |
            <a href="#" id="work-link" class="navigationBar"> Work </a> |
            <a href="#" id="side-missions-link" class="navigationBar"> Side Missions </a>
        </p>
        <div id="projects-container">
            <!-- Project cards will be inserted here by JavaScript -->
        </div>
    </main>
    <footer>

    </footer>
    <script>
        function loadProjects() {
            fetch('/sources/projects.json')
                .then(response => response.json())
                .then(data => {
                    const projectsContainer = document.getElementById('projects-container');
                    projectsContainer.innerHTML = ''; // Clear existing content
                    data.projects.forEach(project => {
                        const projectCard = document.createElement('div');
                        projectCard.className = 'project-card';
                        const description = project.description.replace(/\n/g, '<br>');
                        const links = project.links.map(link => `<a class="project-link" href="${link.url}" target="_blank">${link.title}</a>`).join(' | ');
                        projectCard.innerHTML = `
                            <h2 class="project-title">${project.name}</h2>
                            <p class="project-date">${project.dateRange}</p>
                            <p class="project-description">${description}</p>
                            ${links}
                        `;
                        projectsContainer.appendChild(projectCard);
                    });
                })
                .catch(error => console.error('Error fetching projects:', error));
        }

        function loadWorkExperience() {
            fetch('/sources/work.json')
                .then(response => response.json())
                .then(data => {
                    const projectsContainer = document.getElementById('projects-container');
                    projectsContainer.innerHTML = ''; // Clear existing content
                    data.work.forEach(work => {
                        const workCard = document.createElement('div');
                        workCard.className = 'project-card';
                        const description = work.description.replace(/\n/g, '<br>');
                        workCard.innerHTML = `
                            <h2 class="project-title">${work.name}</h2>
                            <p class="project-date">${work.dateRange}</p>
                            <p class="project-organization">${work.organization.name}<br>${work.organization.location}</p>
                            <p class="project-description">${description}</p>
                        `;
                        projectsContainer.appendChild(workCard);
                    });
                })
                .catch(error => console.error('Error fetching work experience:', error));
        }

        function loadSideMissions() {
            fetch('/sources/side-missions.json')
                .then(response => response.json())
                .then(data => {
                    const projectsContainer = document.getElementById('projects-container');
                    projectsContainer.innerHTML = ''; // Clear existing content
                    data["side-missions"].forEach(mission => {
                        const missionCard = document.createElement('div');
                        missionCard.className = 'project-card';
                        const description = mission.description.replace(/\n/g, '<br>');
                        missionCard.innerHTML = `
                            <h2 class="project-title">${mission.title}</h2>
                            <p class="project-description">${description}</p>
                            <p class="project-date">Location: ${mission.location}</p>
                            <p class="project-date">Reward: ${mission.reward}</p>
                            <p class="project-date">Difficulty: ${mission.difficulty}</p>
                            <p class="project-date">Duration: ${mission.duration}</p>
                        `;
                        projectsContainer.appendChild(missionCard);
                    });
                })
                .catch(error => console.error('Error fetching side missions:', error));
        }

        document.getElementById('projects-link').addEventListener('click', loadProjects);
        document.getElementById('work-link').addEventListener('click', loadWorkExperience);
        document.getElementById('side-missions-link').addEventListener('click', loadSideMissions);

        // Load projects by default
        loadProjects();
    </script>
</body>
</html>
