name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true  # Fetch the suchedule submodule
          fetch-depth: 0    # Fetch all history for proper submodule checkout

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Debug - List Files
        run: find . -maxdepth 2 -type f | sort

      - name: Verify Entry File
        run: |
          if [ -f "index.html" ]; then
            echo "✅ index.html found in root directory"
            cat index.html | head -20
          else
            echo "❌ index.html NOT found in root directory"
            exit 1
          fi

      - name: Build
        run: VITE_DEBUG=true npm run build

      - name: Debug - List Dist Contents
        run: |
          echo "Root dist directory:"
          ls -la dist/
          echo "JavaScript files:"
          find dist/assets -name "*.js" | head -10
          echo "First few lines of index.html:"
          cat dist/index.html | head -20

      - name: Copy Suchedule to Dist
        run: |
          cp -r suchedule dist/
          echo "✅ Copied suchedule directory to dist/"
          find dist/suchedule -maxdepth 2 -type f | head -10

      - name: Create .nojekyll
        run: touch dist/.nojekyll

      - name: Copy 404 page
        run: |
          if [ -f "dist/404.html" ]; then
            echo "✅ 404.html already exists in dist"
          else
            echo "Copying 404.html to dist"
            cp public/404.html dist/ || echo "Failed to copy 404.html"
          fi

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages 