name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true  # Fetch the suchedule submodule
          fetch-depth: 0    # Fetch all history for proper submodule checkout

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Debug - Update Vite Config
        run: |
          # Update vite.config.ts to use relative paths
          if grep -q "base: \"\"" vite.config.ts || grep -q "base: \"/\"" vite.config.ts; then
            sed -i 's/base: \"\"/base: \"\.\/\"/g' vite.config.ts
            sed -i 's/base: \"\/\"/base: \"\.\/\"/g' vite.config.ts
            echo "✅ Updated vite.config.ts to use base: './' for GitHub Pages"
            grep -n "base:" vite.config.ts
          fi

      - name: Fix index.html
        run: |
          if grep -q "src=\"/src/main.tsx\"" index.html; then
            sed -i 's|<script type="module" src="/src/main.tsx"></script>|<script type="module" src="./src/main.tsx"></script>|g' index.html
            echo "✅ Updated index.html to use relative paths"
          fi

      - name: Build
        run: VITE_DEBUG=true npm run build

      - name: Debug - List Dist Contents
        run: |
          echo "Root dist directory:"
          ls -la dist/
          echo "JavaScript files:"
          find dist/assets -name "*.js" | head -10
          echo "First few lines of index.html:"
          cat dist/index.html | head -20

      - name: Fix Asset Paths in dist/index.html
        run: |
          if [ -f "dist/index.html" ]; then
            # Fix any absolute paths in script and link tags
            sed -i 's|src="/assets/|src="./assets/|g' dist/index.html
            sed -i 's|href="/assets/|href="./assets/|g' dist/index.html
            
            # Create a test file to verify serving
            cat > dist/test.html << EOF
          <!DOCTYPE html>
          <html>
          <head>
            <title>Test Page</title>
          </head>
          <body>
            <h1>Test Page - If you can see this, basic serving is working</h1>
            <p>This is a test page to verify that static files are being served correctly.</p>
            <p><a href="./index.html">Go to main application</a></p>
          </body>
          </html>
          EOF
            echo "✅ Fixed paths and created test.html"
          else
            echo "❌ dist/index.html not found"
            exit 1
          fi

      - name: Copy Suchedule to Dist
        run: |
          cp -r suchedule dist/
          echo "✅ Copied suchedule directory to dist/"
          find dist/suchedule -maxdepth 2 -type f | head -10

      - name: Create .nojekyll
        run: touch dist/.nojekyll

      - name: Copy 404 page
        run: |
          if [ -f "dist/404.html" ]; then
            echo "✅ 404.html already exists in dist"
          else
            echo "Copying 404.html to dist"
            cp public/404.html dist/ || echo "Failed to copy 404.html"
          fi

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages 