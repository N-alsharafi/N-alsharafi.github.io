<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="100%" stop-color="#222" />
      <animate attributeName="x1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
      <animate attributeName="y1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="gridPattern" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="none" stroke="#0f0" stroke-width="0.5" opacity="0.1" />
      <line x1="0" y1="0" x2="50" y2="50" stroke="#0f0" stroke-width="0.2" opacity="0.1" />
      <line x1="50" y1="0" x2="0" y2="50" stroke="#0f0" stroke-width="0.2" opacity="0.1" />
    </pattern>
    <pattern id="circuitPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none" />
      <circle cx="10" cy="10" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="0" cy="0" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="0" cy="20" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="20" cy="0" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="20" cy="20" r="1" fill="#0f0" opacity="0.1" />
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bgGradient)" />
  <rect width="400" height="400" fill="url(#gridPattern)" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="10s" repeatCount="indefinite" />
  </rect>
  <rect width="400" height="400" fill="url(#circuitPattern)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="15s" repeatCount="indefinite" />
  </rect>
  <g transform="translate(200, 160)" filter="url(#glow)">
    <circle cx="0" cy="0" r="80" fill="#333" stroke="#0ff" stroke-width="2">
      <animate attributeName="stroke" values="#0ff;#0f0;#0ff" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#0f0" stroke-width="1" stroke-dasharray="5,3" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="-20" font-family="monospace" font-size="10" fill="#0ff" text-anchor="middle">AI ETHICS</text>
    <text x="0" y="10" font-family="monospace" font-size="8" fill="#0ff" text-anchor="middle">&#x2696;&#xFE0F;</text>
    <text x="0" y="25" font-family="monospace" font-size="7" fill="#0ff" text-anchor="middle">BALANCE</text>
  </g>
  <g transform="translate(85, 90)" filter="url(#glow)">
    <rect x="-55" y="-30" width="110" height="60" rx="5" fill="#333" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="3s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="-15" font-family="monospace" font-size="7" fill="#0f0" text-anchor="middle">ACCOUNTABILITY</text>
    <text x="0" y="0" font-family="monospace" font-size="6" fill="#0f0" text-anchor="middle">Human Oversight</text>
    <text x="0" y="10" font-family="monospace" font-size="6" fill="#0f0" text-anchor="middle">Audit Trails</text>
  </g>
  <g transform="translate(315, 90)" filter="url(#glow)">
    <rect x="-55" y="-30" width="110" height="60" rx="5" fill="#333" stroke="#f0f" stroke-width="2">
      <animate attributeName="stroke" values="#f0f;#0ff;#f0f" dur="3.2s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="-15" font-family="monospace" font-size="7" fill="#f0f" text-anchor="middle">RESPONSIBILITY</text>
    <text x="0" y="0" font-family="monospace" font-size="6" fill="#f0f" text-anchor="middle">Transparency</text>
    <text x="0" y="10" font-family="monospace" font-size="6" fill="#f0f" text-anchor="middle">Fair Allocation</text>
  </g>
  <g transform="translate(85, 260)" filter="url(#glow)">
    <rect x="-55" y="-30" width="110" height="60" rx="5" fill="#333" stroke="#ff0" stroke-width="2">
      <animate attributeName="stroke" values="#ff0;#0f0;#ff0" dur="3.4s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="-15" font-family="monospace" font-size="6" fill="#ff0" text-anchor="middle">STAKEHOLDER</text>
    <text x="0" y="-5" font-family="monospace" font-size="6" fill="#ff0" text-anchor="middle">BALANCING</text>
    <text x="0" y="8" font-family="monospace" font-size="6" fill="#ff0" text-anchor="middle">Conflicting Needs</text>
  </g>
  <g transform="translate(315, 260)" filter="url(#glow)">
    <rect x="-55" y="-30" width="110" height="60" rx="5" fill="#333" stroke="#0ff" stroke-width="2">
      <animate attributeName="stroke" values="#0ff;#f0f;#0ff" dur="3.6s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="-15" font-family="monospace" font-size="7" fill="#0ff" text-anchor="middle">GOVERNANCE</text>
    <text x="0" y="0" font-family="monospace" font-size="6" fill="#0ff" text-anchor="middle">Ethical Framework</text>
    <text x="0" y="10" font-family="monospace" font-size="6" fill="#0ff" text-anchor="middle">Compliance</text>
  </g>
  <line x1="140" y1="120" x2="170" y2="145" stroke="#0f0" stroke-width="1.5" filter="url(#glow)" stroke-dasharray="4,2">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" />
  </line>
  <line x1="260" y1="120" x2="230" y2="145" stroke="#0f0" stroke-width="1.5" filter="url(#glow)" stroke-dasharray="4,2">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite" />
  </line>
  <line x1="140" y1="230" x2="170" y2="210" stroke="#0f0" stroke-width="1.5" filter="url(#glow)" stroke-dasharray="4,2">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite" />
  </line>
  <line x1="260" y1="230" x2="230" y2="210" stroke="#0f0" stroke-width="1.5" filter="url(#glow)" stroke-dasharray="4,2">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite" />
  </line>
  <circle cx="155" cy="130" r="2" fill="#0ff" filter="url(#glow)">
    <animate attributeName="cx" values="140;170" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="cy" values="120;145" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="245" cy="130" r="2" fill="#f0f" filter="url(#glow)">
    <animate attributeName="cx" values="260;230" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="cy" values="120;145" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <g transform="translate(200, 50)" filter="url(#glow)">
    <rect x="-70" y="-15" width="140" height="30" rx="3" fill="#333" stroke="#0f0" stroke-width="1">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="5" font-family="monospace" font-size="8" fill="#0f0" text-anchor="middle">MEDICAL RESOURCE ALLOCATION</text>
  </g>
  <line x1="200" y1="65" x2="200" y2="80" stroke="#0f0" stroke-width="2" filter="url(#glow)" stroke-dasharray="3,2">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" />
  </line>
  <text x="200" y="25" font-family="monospace" font-size="16" fill="#0ff" text-anchor="middle" font-weight="bold" filter="url(#glow)">
    <animate attributeName="fill" values="#0ff;#0f0;#0ff" dur="8s" repeatCount="indefinite" />
    ETHICAL AI IN HEALTHCARE
  </text>
  <text x="200" y="40" font-family="monospace" font-size="10" fill="#0ff" text-anchor="middle" filter="url(#glow)">
    <animate attributeName="fill" values="#0ff;#0f0;#0ff" dur="8s" repeatCount="indefinite" />
    RESPONSIBLE AI FRAMEWORK
  </text>
  <rect x="10" y="10" width="380" height="380" stroke="#0ff" stroke-width="3" fill="none" rx="5">
    <animate attributeName="stroke" values="#0ff;#00f;#f00;#0ff" dur="8s" repeatCount="indefinite" />
  </rect>
  <rect width="400" height="2" fill="#fff" opacity="0.1">
    <animate attributeName="y" values="0;400;0" dur="10s" repeatCount="indefinite" />
  </rect>
</svg>