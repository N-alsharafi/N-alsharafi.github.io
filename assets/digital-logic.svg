<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="100%" stop-color="#222" />
      <animate attributeName="x1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
      <animate attributeName="y1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <pattern id="gridPattern" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="none" stroke="#0f0" stroke-width="0.5" opacity="0.1" />
      <line x1="0" y1="0" x2="50" y2="50" stroke="#0f0" stroke-width="0.2" opacity="0.1" />
      <line x1="50" y1="0" x2="0" y2="50" stroke="#0f0" stroke-width="0.2" opacity="0.1" />
    </pattern>
    
    <pattern id="circuitPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none" />
      <circle cx="10" cy="10" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="0" cy="0" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="0" cy="20" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="20" cy="0" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="20" cy="20" r="1" fill="#0f0" opacity="0.1" />
    </pattern>
  </defs>
  
  <!-- Background with grid -->
  <rect width="400" height="400" fill="url(#bgGradient)" />
  <rect width="400" height="400" fill="url(#gridPattern)" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="10s" repeatCount="indefinite" />
  </rect>
  <rect width="400" height="400" fill="url(#circuitPattern)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="15s" repeatCount="indefinite" />
  </rect>
  
  <!-- Logic gates -->
  <g>
    <!-- AND gate -->
    <g transform="translate(100, 150)" filter="url(#glow)">
      <path d="M -25,-20 L -25,20 L 0,20 Q 25,20 25,0 Q 25,-20 0,-20 Z" fill="#333" stroke="#0f0" stroke-width="2" />
      <text x="0" y="5" font-family="monospace" font-size="10" text-anchor="middle" fill="#0f0">AND</text>
      
      <!-- Input and output lines with animation -->
      <line x1="-50" y1="-10" x2="-25" y2="-10" stroke="#0f0" stroke-width="2">
        <animate attributeName="stroke" values="#0f0;#fff;#0f0" dur="1s" repeatCount="indefinite" begin="0.2s" />
      </line>
      <line x1="-50" y1="10" x2="-25" y2="10" stroke="#0f0" stroke-width="2">
        <animate attributeName="stroke" values="#0f0;#fff;#0f0" dur="1s" repeatCount="indefinite" begin="0.5s" />
      </line>
      <line x1="25" y1="0" x2="50" y2="0" stroke="#0f0" stroke-width="2">
        <animate attributeName="stroke" values="#0f0;#fff;#0f0" dur="1s" repeatCount="indefinite" begin="0.8s" />
      </line>
    </g>
    
    <!-- OR gate -->
    <g transform="translate(300, 150)" filter="url(#glow)">
      <path d="M -25,-20 C -25,-20 -25,20 -25,20 C -15,20 0,20 0,20 C 15,20 25,10 25,0 C 25,-10 15,-20 0,-20 C 0,-20 -15,-20 -25,-20 Z" fill="#333" stroke="#0f0" stroke-width="2" />
      <text x="0" y="5" font-family="monospace" font-size="10" text-anchor="middle" fill="#0f0">OR</text>
      
      <!-- Input and output lines with animation -->
      <line x1="-50" y1="-10" x2="-25" y2="-10" stroke="#0f0" stroke-width="2">
        <animate attributeName="stroke" values="#0f0;#fff;#0f0" dur="1s" repeatCount="indefinite" begin="0.3s" />
      </line>
      <line x1="-50" y1="10" x2="-25" y2="10" stroke="#0f0" stroke-width="2">
        <animate attributeName="stroke" values="#0f0;#fff;#0f0" dur="1s" repeatCount="indefinite" begin="0.6s" />
      </line>
      <line x1="25" y1="0" x2="50" y2="0" stroke="#0f0" stroke-width="2">
        <animate attributeName="stroke" values="#0f0;#fff;#0f0" dur="1s" repeatCount="indefinite" begin="0.9s" />
      </line>
    </g>
    
    <!-- NOT gate -->
    <g transform="translate(100, 250)" filter="url(#glow)">
      <path d="M -15,-15 L -15,15 L 15,0 Z" fill="#333" stroke="#0f0" stroke-width="2" />
      <circle cx="18" cy="0" r="5" fill="#333" stroke="#0f0" stroke-width="2" />
      <text x="0" y="0" font-family="monospace" font-size="8" text-anchor="middle" dominant-baseline="middle" fill="#0f0">NOT</text>
      
      <!-- Input and output lines with animation -->
      <line x1="-40" y1="0" x2="-15" y2="0" stroke="#0f0" stroke-width="2">
        <animate attributeName="stroke" values="#0f0;#fff;#0f0" dur="1s" repeatCount="indefinite" begin="0.4s" />
      </line>
      <line x1="23" y1="0" x2="50" y2="0" stroke="#0f0" stroke-width="2">
        <animate attributeName="stroke" values="#0f0;#fff;#0f0" dur="1s" repeatCount="indefinite" begin="0.7s" />
      </line>
    </g>
    
    <!-- XOR gate -->
    <g transform="translate(300, 250)" filter="url(#glow)">
      <path d="M -20,-20 C -20,-20 -20,20 -20,20 C -10,20 0,20 0,20 C 10,20 20,10 20,0 C 20,-10 10,-20 0,-20 C 0,-20 -10,-20 -20,-20 Z" fill="#333" stroke="#0f0" stroke-width="2" />
      <path d="M -25,-20 C -25,-20 -25,20 -25,20" fill="none" stroke="#0f0" stroke-width="2" />
      <text x="0" y="5" font-family="monospace" font-size="10" text-anchor="middle" fill="#0f0">XOR</text>
      
      <!-- Input and output lines with animation -->
      <line x1="-50" y1="-10" x2="-25" y2="-10" stroke="#0f0" stroke-width="2">
        <animate attributeName="stroke" values="#0f0;#fff;#0f0" dur="1s" repeatCount="indefinite" begin="0.1s" />
      </line>
      <line x1="-50" y1="10" x2="-25" y2="10" stroke="#0f0" stroke-width="2">
        <animate attributeName="stroke" values="#0f0;#fff;#0f0" dur="1s" repeatCount="indefinite" begin="0.4s" />
      </line>
      <line x1="20" y1="0" x2="50" y2="0" stroke="#0f0" stroke-width="2">
        <animate attributeName="stroke" values="#0f0;#fff;#0f0" dur="1s" repeatCount="indefinite" begin="0.7s" />
      </line>
    </g>
  </g>
  
  <!-- Calculator Display -->
  <g transform="translate(200, 80)">
    <rect x="-90" y="-25" width="180" height="50" rx="5" fill="#111" stroke="#0f0" stroke-width="2" filter="url(#glow)">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="8" font-family="monospace" font-size="24" text-anchor="middle" fill="#0f0" font-weight="bold" filter="url(#glow)">
      <animate attributeName="textContent" values="01101001;10010110;11001010;01101001" dur="4s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </text>
  </g>
  
  <!-- Binary adder circuit -->
  <g transform="translate(200, 340)">
    <rect x="-120" y="-30" width="240" height="60" rx="5" fill="#333" stroke="#0f0" stroke-width="2" filter="url(#glow)">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    
    <!-- Connection points -->
    <circle cx="-100" cy="-15" r="3" fill="#f00">
      <animate attributeName="fill" values="#f00;#0f0;#f00" dur="2s" repeatCount="indefinite" begin="0.1s" />
    </circle>
    <circle cx="-70" cy="-15" r="3" fill="#f00">
      <animate attributeName="fill" values="#f00;#0f0;#f00" dur="2s" repeatCount="indefinite" begin="0.3s" />
    </circle>
    <circle cx="-40" cy="-15" r="3" fill="#f00">
      <animate attributeName="fill" values="#f00;#0f0;#f00" dur="2s" repeatCount="indefinite" begin="0.5s" />
    </circle>
    <circle cx="-10" cy="-15" r="3" fill="#f00">
      <animate attributeName="fill" values="#f00;#0f0;#f00" dur="2s" repeatCount="indefinite" begin="0.7s" />
    </circle>
    
    <circle cx="10" cy="-15" r="3" fill="#00f">
      <animate attributeName="fill" values="#00f;#0f0;#00f" dur="2s" repeatCount="indefinite" begin="0.9s" />
    </circle>
    <circle cx="40" cy="-15" r="3" fill="#00f">
      <animate attributeName="fill" values="#00f;#0f0;#00f" dur="2s" repeatCount="indefinite" begin="1.1s" />
    </circle>
    <circle cx="70" cy="-15" r="3" fill="#00f">
      <animate attributeName="fill" values="#00f;#0f0;#00f" dur="2s" repeatCount="indefinite" begin="1.3s" />
    </circle>
    <circle cx="100" cy="-15" r="3" fill="#00f">
      <animate attributeName="fill" values="#00f;#0f0;#00f" dur="2s" repeatCount="indefinite" begin="1.5s" />
    </circle>
    
    <!-- Connection lines -->
    <line x1="-100" y1="-15" x2="-70" y2="-15" stroke="#0f0" stroke-width="1">
      <animate attributeName="stroke" values="#0f0;#fff;#0f0" dur="1s" repeatCount="indefinite" begin="0.2s" />
    </line>
    <line x1="-70" y1="-15" x2="-40" y2="-15" stroke="#0f0" stroke-width="1">
      <animate attributeName="stroke" values="#0f0;#fff;#0f0" dur="1s" repeatCount="indefinite" begin="0.4s" />
    </line>
    <line x1="-40" y1="-15" x2="-10" y2="-15" stroke="#0f0" stroke-width="1">
      <animate attributeName="stroke" values="#0f0;#fff;#0f0" dur="1s" repeatCount="indefinite" begin="0.6s" />
    </line>
    <line x1="-10" y1="-15" x2="10" y2="-15" stroke="#0f0" stroke-width="1">
      <animate attributeName="stroke" values="#0f0;#fff;#0f0" dur="1s" repeatCount="indefinite" begin="0.8s" />
    </line>
    <line x1="10" y1="-15" x2="40" y2="-15" stroke="#0f0" stroke-width="1">
      <animate attributeName="stroke" values="#0f0;#fff;#0f0" dur="1s" repeatCount="indefinite" begin="1.0s" />
    </line>
    <line x1="40" y1="-15" x2="70" y2="-15" stroke="#0f0" stroke-width="1">
      <animate attributeName="stroke" values="#0f0;#fff;#0f0" dur="1s" repeatCount="indefinite" begin="1.2s" />
    </line>
    <line x1="70" y1="-15" x2="100" y2="-15" stroke="#0f0" stroke-width="1">
      <animate attributeName="stroke" values="#0f0;#fff;#0f0" dur="1s" repeatCount="indefinite" begin="1.4s" />
    </line>
    
    <!-- Result indicators -->
    <circle cx="-85" cy="15" r="5" fill="#0f0">
      <animate attributeName="fill" values="#000;#0f0;#000" dur="3s" repeatCount="indefinite" begin="0.5s" />
    </circle>
    <circle cx="-45" cy="15" r="5" fill="#0f0">
      <animate attributeName="fill" values="#000;#0f0;#000" dur="3s" repeatCount="indefinite" begin="1.0s" />
    </circle>
    <circle cx="0" cy="15" r="5" fill="#0f0">
      <animate attributeName="fill" values="#000;#0f0;#000" dur="3s" repeatCount="indefinite" begin="1.5s" />
    </circle>
    <circle cx="45" cy="15" r="5" fill="#0f0">
      <animate attributeName="fill" values="#000;#0f0;#000" dur="3s" repeatCount="indefinite" begin="2.0s" />
    </circle>
    <circle cx="85" cy="15" r="5" fill="#0f0">
      <animate attributeName="fill" values="#000;#0f0;#000" dur="3s" repeatCount="indefinite" begin="2.5s" />
    </circle>
    
    <text x="0" y="0" font-family="monospace" font-size="12" text-anchor="middle" fill="#0f0">BINARY ADDER</text>
  </g>
  
  <!-- Title -->
  <text x="200" y="35" font-family="monospace" font-size="16" fill="#0f0" text-anchor="middle" font-weight="bold" filter="url(#glow)">
    <animate attributeName="fill" values="#0f0;#0ff;#f0f;#0f0" dur="8s" repeatCount="indefinite" />
    DIGITAL LOGIC CALCULATOR
  </text>
  
  <!-- Retro computer frame -->
  <rect x="10" y="10" width="380" height="380" stroke="#0f0" stroke-width="3" fill="none" rx="5">
    <animate attributeName="stroke" values="#0f0;#00f;#f00;#0f0" dur="8s" repeatCount="indefinite" />
  </rect>
  
  <!-- Scanline effect -->
  <rect width="400" height="2" fill="#fff" opacity="0.1">
    <animate attributeName="y" values="0;400;0" dur="10s" repeatCount="indefinite" />
  </rect>
  
  <!-- Data flow animation -->
  <circle cx="100" cy="190" r="3" fill="#0ff" filter="url(#glow)">
    <animate attributeName="cx" values="100;300" dur="3s" repeatCount="indefinite" />
    <animate attributeName="cy" values="190;190" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0" dur="3s" repeatCount="indefinite" />
    <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="100" cy="290" r="3" fill="#0ff" filter="url(#glow)">
    <animate attributeName="cx" values="100;300" dur="3s" repeatCount="indefinite" begin="1s" />
    <animate attributeName="cy" values="290;290" dur="3s" repeatCount="indefinite" begin="1s" />
    <animate attributeName="opacity" values="1;0" dur="3s" repeatCount="indefinite" begin="1s" />
    <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite" begin="1s" />
  </circle>
  
  <circle cx="300" cy="190" r="3" fill="#f0f" filter="url(#glow)">
    <animate attributeName="cx" values="300;200;200" dur="3s" repeatCount="indefinite" begin="2s" />
    <animate attributeName="cy" values="190;190;340" dur="3s" repeatCount="indefinite" begin="2s" />
    <animate attributeName="opacity" values="1;0" dur="3s" repeatCount="indefinite" begin="2s" />
    <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite" begin="2s" />
  </circle>
  
  <circle cx="300" cy="290" r="3" fill="#f0f" filter="url(#glow)">
    <animate attributeName="cx" values="300;200;200" dur="3s" repeatCount="indefinite" begin="1.5s" />
    <animate attributeName="cy" values="290;290;340" dur="3s" repeatCount="indefinite" begin="1.5s" />
    <animate attributeName="opacity" values="1;0" dur="3s" repeatCount="indefinite" begin="1.5s" />
    <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite" begin="1.5s" />
  </circle>
</svg> 