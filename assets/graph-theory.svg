<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="100%" stop-color="#222" />
      <animate attributeName="x1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
      <animate attributeName="y1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <pattern id="gridPattern" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="none" stroke="#0f0" stroke-width="0.5" opacity="0.1" />
      <line x1="0" y1="0" x2="50" y2="50" stroke="#0f0" stroke-width="0.2" opacity="0.1" />
      <line x1="50" y1="0" x2="0" y2="50" stroke="#0f0" stroke-width="0.2" opacity="0.1" />
    </pattern>
    
    <pattern id="circuitPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none" />
      <circle cx="10" cy="10" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="0" cy="0" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="0" cy="20" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="20" cy="0" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="20" cy="20" r="1" fill="#0f0" opacity="0.1" />
    </pattern>
  </defs>

  <!-- Background with grid -->
  <rect width="400" height="400" fill="url(#bgGradient)" />
  <rect width="400" height="400" fill="url(#gridPattern)" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="10s" repeatCount="indefinite" />
  </rect>
  <rect width="400" height="400" fill="url(#circuitPattern)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="15s" repeatCount="indefinite" />
  </rect>
  
  <!-- Graph nodes and edges -->
  <g transform="translate(200, 200)">
    <!-- Edges -->
    <g stroke="#0f0" stroke-width="2" filter="url(#glow)">
      <!-- Connect A to B -->
      <line x1="-80" y1="-80" x2="0" y2="-100" opacity="0.7">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" />
      </line>
      
      <!-- Connect A to C -->
      <line x1="-80" y1="-80" x2="-80" y2="80" opacity="0.7">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.7;1;0.7" dur="3.5s" repeatCount="indefinite" />
      </line>
      
      <!-- Connect B to D -->
      <line x1="0" y1="-100" x2="80" y2="0" opacity="0.7">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite" />
      </line>
      
      <!-- Connect B to E -->
      <line x1="0" y1="-100" x2="0" y2="100" opacity="0.7">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.7;1;0.7" dur="4.5s" repeatCount="indefinite" />
      </line>
      
      <!-- Connect C to E -->
      <line x1="-80" y1="80" x2="0" y2="100" opacity="0.7">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite" />
      </line>
      
      <!-- Connect D to E -->
      <line x1="80" y1="0" x2="0" y2="100" opacity="0.7">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.7;1;0.7" dur="5.5s" repeatCount="indefinite" />
      </line>
      
      <!-- Connect D to F -->
      <line x1="80" y1="0" x2="80" y2="80" opacity="0.7">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite" />
      </line>
      
      <!-- Connect E to F -->
      <line x1="0" y1="100" x2="80" y2="80" opacity="0.7">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.7;1;0.7" dur="6.5s" repeatCount="indefinite" />
      </line>
    </g>
    
    <!-- Nodes -->
    <g>
      <!-- Node A -->
      <circle cx="-80" cy="-80" r="20" fill="#333" stroke="#0f0" stroke-width="2" filter="url(#glow)">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
      </circle>
      <text x="-80" y="-75" font-family="monospace" font-size="14" fill="#0f0" text-anchor="middle">A</text>
      
      <!-- Node B -->
      <circle cx="0" cy="-100" r="20" fill="#333" stroke="#0f0" stroke-width="2" filter="url(#glow)">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="-95" font-family="monospace" font-size="14" fill="#0f0" text-anchor="middle">B</text>
      
      <!-- Node C -->
      <circle cx="-80" cy="80" r="20" fill="#333" stroke="#0f0" stroke-width="2" filter="url(#glow)">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
      </circle>
      <text x="-80" y="85" font-family="monospace" font-size="14" fill="#0f0" text-anchor="middle">C</text>
      
      <!-- Node D -->
      <circle cx="80" cy="0" r="20" fill="#333" stroke="#0f0" stroke-width="2" filter="url(#glow)">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
      </circle>
      <text x="80" y="5" font-family="monospace" font-size="14" fill="#0f0" text-anchor="middle">D</text>
      
      <!-- Node E -->
      <circle cx="0" cy="100" r="20" fill="#333" stroke="#0f0" stroke-width="2" filter="url(#glow)">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="105" font-family="monospace" font-size="14" fill="#0f0" text-anchor="middle">E</text>
      
      <!-- Node F -->
      <circle cx="80" cy="80" r="20" fill="#333" stroke="#0f0" stroke-width="2" filter="url(#glow)">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
      </circle>
      <text x="80" y="85" font-family="monospace" font-size="14" fill="#0f0" text-anchor="middle">F</text>
    </g>
  </g>
  
  <!-- Animation of traversal -->
  <g>
    <!-- Animated path -->
    <circle cx="120" cy="120" r="5" fill="#f0f" filter="url(#glow)">
      <animate 
        attributeName="cx" 
        values="120;200;280;200;200;120;120" 
        dur="6s" 
        repeatCount="indefinite" />
      <animate 
        attributeName="cy" 
        values="120;100;200;300;100;280;120" 
        dur="6s" 
        repeatCount="indefinite" />
      <animate 
        attributeName="opacity"
        values="1;0.8;1;0.8;1;0.8;1"
        dur="6s"
        repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Algorithm box -->
  <g transform="translate(70, 60)">
    <rect x="-50" y="-30" width="100" height="60" rx="5" fill="#333" stroke="#0f0" stroke-width="2" filter="url(#glow)">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    
    <text x="0" y="-10" font-family="monospace" font-size="10" fill="#0f0" text-anchor="middle">DFS ALGORITHM</text>
    <text x="0" y="10" font-family="monospace" font-size="8" fill="#0f0" text-anchor="middle">
      <animate attributeName="textContent" values="VISITING NODE A;VISITING NODE B;VISITING NODE D;VISITING NODE F;VISITING NODE E;VISITING NODE C" dur="6s" repeatCount="indefinite" />
    </text>
  </g>
  
  <!-- Matrix representation -->
  <g transform="translate(330, 60)">
    <rect x="-50" y="-30" width="100" height="60" rx="5" fill="#333" stroke="#0f0" stroke-width="2" filter="url(#glow)">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    
    <text x="0" y="-15" font-family="monospace" font-size="8" fill="#0f0" text-anchor="middle">ADJACENCY MATRIX</text>
    <text x="0" y="0" font-family="monospace" font-size="6" fill="#0f0" text-anchor="middle">0 1 1 0 0 0</text>
    <text x="0" y="10" font-family="monospace" font-size="6" fill="#0f0" text-anchor="middle">1 0 0 1 1 0</text>
    <text x="0" y="20" font-family="monospace" font-size="6" fill="#0f0" text-anchor="middle">1 0 0 0 1 0</text>
  </g>
  
  <!-- Complexity box -->
  <g transform="translate(330, 340)">
    <rect x="-50" y="-30" width="100" height="60" rx="5" fill="#333" stroke="#0f0" stroke-width="2" filter="url(#glow)">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    
    <text x="0" y="-15" font-family="monospace" font-size="8" fill="#0f0" text-anchor="middle">TIME COMPLEXITY</text>
    <text x="0" y="0" font-family="monospace" font-size="8" fill="#0f0" text-anchor="middle">O(V + E)</text>
    <text x="0" y="15" font-family="monospace" font-size="8" fill="#0f0" text-anchor="middle">V=VERTICES</text>
    <text x="0" y="25" font-family="monospace" font-size="8" fill="#0f0" text-anchor="middle">E=EDGES</text>
  </g>
  
  <!-- Applications box -->
  <g transform="translate(70, 340)">
    <rect x="-50" y="-30" width="100" height="60" rx="5" fill="#333" stroke="#0f0" stroke-width="2" filter="url(#glow)">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    
    <text x="0" y="-15" font-family="monospace" font-size="8" fill="#0f0" text-anchor="middle">APPLICATIONS</text>
    <text x="0" y="0" font-family="monospace" font-size="6" fill="#0f0" text-anchor="middle">SOCIAL NETWORKS</text>
    <text x="0" y="10" font-family="monospace" font-size="6" fill="#0f0" text-anchor="middle">WEB CRAWLING</text>
    <text x="0" y="20" font-family="monospace" font-size="6" fill="#0f0" text-anchor="middle">GPS NAVIGATION</text>
  </g>
  
  <!-- Title -->
  <text x="200" y="35" font-family="monospace" font-size="16" fill="#0f0" text-anchor="middle" font-weight="bold" filter="url(#glow)">
    <animate attributeName="fill" values="#0f0;#0ff;#f0f;#0f0" dur="8s" repeatCount="indefinite" />
    GRAPH THEORY ALGORITHMS
  </text>
  
  <!-- Retro computer frame -->
  <rect x="10" y="10" width="380" height="380" stroke="#0f0" stroke-width="3" fill="none" rx="5">
    <animate attributeName="stroke" values="#0f0;#00f;#f00;#0f0" dur="8s" repeatCount="indefinite" />
  </rect>
  
  <!-- Scanline effect -->
  <rect width="400" height="2" fill="#fff" opacity="0.1">
    <animate attributeName="y" values="0;400;0" dur="10s" repeatCount="indefinite" />
  </rect>
</svg> 