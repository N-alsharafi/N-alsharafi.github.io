<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="100%" stop-color="#222" />
      <animate attributeName="x1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
      <animate attributeName="y1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <pattern id="gridPattern" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="none" stroke="#0f0" stroke-width="0.5" opacity="0.1" />
      <line x1="0" y1="0" x2="50" y2="50" stroke="#0f0" stroke-width="0.2" opacity="0.1" />
      <line x1="50" y1="0" x2="0" y2="50" stroke="#0f0" stroke-width="0.2" opacity="0.1" />
    </pattern>
    
    <pattern id="circuitPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none" />
      <circle cx="10" cy="10" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="0" cy="0" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="0" cy="20" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="20" cy="0" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="20" cy="20" r="1" fill="#0f0" opacity="0.1" />
    </pattern>
  </defs>
  
  <!-- Background with grid -->
  <rect width="400" height="400" fill="url(#bgGradient)" />
  <rect width="400" height="400" fill="url(#gridPattern)" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="10s" repeatCount="indefinite" />
  </rect>
  <rect width="400" height="400" fill="url(#circuitPattern)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="15s" repeatCount="indefinite" />
  </rect>
  
  <!-- Email envelope -->
  <g transform="translate(200, 200)" filter="url(#glow)">
    <!-- Envelope body -->
    <rect x="-70" y="-50" width="140" height="100" fill="#333" stroke="#0f0" stroke-width="2" rx="5">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="5s" repeatCount="indefinite" />
    </rect>
    
    <!-- Envelope flap (triangular top) -->
    <path d="M -70,-50 L 0,-10 L 70,-50 Z" fill="#444" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="5s" repeatCount="indefinite" />
    </path>
    
    <!-- @ symbol -->
    <text x="0" y="10" font-family="monospace" font-size="40" fill="#0f0" text-anchor="middle" filter="url(#glow)">
      <animate attributeName="fill" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
      @
    </text>
  </g>
  
  <!-- Server icon -->
  <g transform="translate(100, 100)" filter="url(#glow)">
    <rect x="-30" y="-40" width="60" height="80" fill="#333" stroke="#0f0" stroke-width="2" rx="5">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    
    <!-- Server details -->
    <line x1="-20" y1="-25" x2="20" y2="-25" stroke="#0f0" stroke-width="1">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="-20" y1="-10" x2="20" y2="-10" stroke="#0f0" stroke-width="1">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="-20" y1="5" x2="20" y2="5" stroke="#0f0" stroke-width="1">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="-20" y1="20" x2="20" y2="20" stroke="#0f0" stroke-width="1">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </line>
    
    <circle cx="0" cy="-32" r="3" fill="#f00">
      <animate attributeName="fill" values="#f00;#0f0;#f00" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Client/user device -->
  <g transform="translate(300, 100)" filter="url(#glow)">
    <rect x="-30" y="-25" width="60" height="50" fill="#333" stroke="#0f0" stroke-width="2" rx="3">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    
    <!-- Screen -->
    <rect x="-25" y="-20" width="50" height="35" fill="#111" stroke="#0f0" stroke-width="1">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    
    <!-- User interface -->
    <line x1="-20" y1="-10" x2="20" y2="-10" stroke="#0f0" stroke-width="1" opacity="0.7">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" />
    </line>
    <line x1="-20" y1="0" x2="10" y2="0" stroke="#0f0" stroke-width="1" opacity="0.7">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.3s" />
    </line>
    <line x1="-20" y1="10" x2="15" y2="10" stroke="#0f0" stroke-width="1" opacity="0.7">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.6s" />
    </line>
  </g>
  
  <!-- Email packets animation -->
  <g>
    <!-- Packet 1: Server to envelope -->
    <circle cx="100" cy="100" r="5" fill="#0f0" filter="url(#glow)">
      <animate attributeName="cx" values="100;200" dur="2s" repeatCount="indefinite" />
      <animate attributeName="cy" values="100;200" dur="2s" repeatCount="indefinite" />
      <animate attributeName="r" values="5;3;5" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" />
    </circle>
    
    <!-- Packet 2: Envelope to client -->
    <circle cx="200" cy="200" r="5" fill="#0ff" filter="url(#glow)">
      <animate attributeName="cx" values="200;300" dur="2s" repeatCount="indefinite" begin="1s" />
      <animate attributeName="cy" values="200;100" dur="2s" repeatCount="indefinite" begin="1s" />
      <animate attributeName="r" values="5;3;5" dur="2s" repeatCount="indefinite" begin="1s" />
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" begin="1s" />
    </circle>
    
    <!-- Packet 3: Client to envelope -->
    <circle cx="300" cy="100" r="5" fill="#f0f" filter="url(#glow)">
      <animate attributeName="cx" values="300;200" dur="2s" repeatCount="indefinite" begin="2s" />
      <animate attributeName="cy" values="100;200" dur="2s" repeatCount="indefinite" begin="2s" />
      <animate attributeName="r" values="5;3;5" dur="2s" repeatCount="indefinite" begin="2s" />
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" begin="2s" />
    </circle>
    
    <!-- Packet 4: Envelope to server -->
    <circle cx="200" cy="200" r="5" fill="#ff0" filter="url(#glow)">
      <animate attributeName="cx" values="200;100" dur="2s" repeatCount="indefinite" begin="3s" />
      <animate attributeName="cy" values="200;100" dur="2s" repeatCount="indefinite" begin="3s" />
      <animate attributeName="r" values="5;3;5" dur="2s" repeatCount="indefinite" begin="3s" />
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" begin="3s" />
    </circle>
  </g>
  
  <!-- Email notification -->
  <g transform="translate(300, 300)" filter="url(#glow)">
    <rect x="-50" y="-25" width="100" height="50" fill="#333" stroke="#0f0" stroke-width="2" rx="5">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    
    <text x="0" y="-5" font-family="monospace" font-size="10" fill="#0f0" text-anchor="middle">
      <animate attributeName="fill" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
      NEW MESSAGE
    </text>
    
    <text x="0" y="15" font-family="monospace" font-size="10" fill="#0ff" text-anchor="middle">
      <animate attributeName="textContent" values="PROCESSING;DELIVERING;RECEIVED" dur="4s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#0ff;#f0f;#0ff" dur="4s" repeatCount="indefinite" />
    </text>
  </g>
  
  <!-- SMTP protocol -->
  <g transform="translate(100, 300)" filter="url(#glow)">
    <rect x="-50" y="-25" width="100" height="50" fill="#333" stroke="#0f0" stroke-width="2" rx="5">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    
    <text x="0" y="-5" font-family="monospace" font-size="10" fill="#0f0" text-anchor="middle">
      <animate attributeName="fill" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
      SMTP PROTOCOL
    </text>
    
    <text x="0" y="15" font-family="monospace" font-size="10" fill="#0ff" text-anchor="middle">
      <animate attributeName="textContent" values="CONNECTING;SENDING;COMPLETED" dur="5s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#0ff;#f0f;#0ff" dur="4s" repeatCount="indefinite" />
    </text>
  </g>
  
  <!-- Title -->
  <text x="200" y="35" font-family="monospace" font-size="16" fill="#0f0" text-anchor="middle" font-weight="bold" filter="url(#glow)">
    <animate attributeName="fill" values="#0f0;#0ff;#f0f;#0f0" dur="8s" repeatCount="indefinite" />
    EMAIL SERVICE SYSTEM
  </text>
  
  <!-- Retro computer frame -->
  <rect x="10" y="10" width="380" height="380" stroke="#0f0" stroke-width="3" fill="none" rx="5">
    <animate attributeName="stroke" values="#0f0;#00f;#f00;#0f0" dur="8s" repeatCount="indefinite" />
  </rect>
  
  <!-- Scanline effect -->
  <rect width="400" height="2" fill="#fff" opacity="0.1">
    <animate attributeName="y" values="0;400;0" dur="10s" repeatCount="indefinite" />
  </rect>
</svg> 