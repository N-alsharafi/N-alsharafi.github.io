<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="100%" stop-color="#222" />
      <animate attributeName="x1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
      <animate attributeName="y1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <pattern id="gridPattern" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="none" stroke="#0f0" stroke-width="0.5" opacity="0.1" />
      <line x1="0" y1="0" x2="50" y2="50" stroke="#0f0" stroke-width="0.2" opacity="0.1" />
      <line x1="50" y1="0" x2="0" y2="50" stroke="#0f0" stroke-width="0.2" opacity="0.1" />
    </pattern>
    
    <pattern id="circuitPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none" />
      <circle cx="10" cy="10" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="0" cy="0" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="0" cy="20" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="20" cy="0" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="20" cy="20" r="1" fill="#0f0" opacity="0.1" />
    </pattern>
  </defs>

  <!-- Background with grid -->
  <rect width="400" height="400" fill="url(#bgGradient)" />
  <rect width="400" height="400" fill="url(#gridPattern)" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="10s" repeatCount="indefinite" />
  </rect>
  <rect width="400" height="400" fill="url(#circuitPattern)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="15s" repeatCount="indefinite" />
  </rect>
  
  <!-- Database Cylinders -->
  <g transform="translate(200, 200)">
    <!-- Main Database -->
    <g filter="url(#glow)">
      <ellipse cx="0" cy="-40" rx="50" ry="20" fill="#333" stroke="#0f0" stroke-width="2">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
      </ellipse>
      <rect x="-50" y="-40" width="100" height="80" fill="#333" stroke="#0f0" stroke-width="2">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
      </rect>
      <ellipse cx="0" cy="40" rx="50" ry="20" fill="#333" stroke="#0f0" stroke-width="2">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
      </ellipse>
      
      <!-- Database rings -->
      <line x1="-50" y1="-15" x2="50" y2="-15" stroke="#0f0" stroke-width="1" />
      <line x1="-50" y1="10" x2="50" y2="10" stroke="#0f0" stroke-width="1" />
      
      <!-- Database label -->
      <text x="0" y="0" font-family="monospace" font-size="14" fill="#0f0" text-anchor="middle" filter="url(#glow)">
        <animate attributeName="fill" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
        DB
      </text>
    </g>
    
    <!-- Small Database 1 -->
    <g transform="translate(-100, -80)" filter="url(#glow)">
      <ellipse cx="0" cy="-15" rx="25" ry="10" fill="#333" stroke="#0f0" stroke-width="2">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
      </ellipse>
      <rect x="-25" y="-15" width="50" height="30" fill="#333" stroke="#0f0" stroke-width="2">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
      </rect>
      <ellipse cx="0" cy="15" rx="25" ry="10" fill="#333" stroke="#0f0" stroke-width="2">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
      </ellipse>
      <text x="0" y="0" font-family="monospace" font-size="8" fill="#0f0" text-anchor="middle">SQL</text>
    </g>
    
    <!-- Small Database 2 -->
    <g transform="translate(100, -80)" filter="url(#glow)">
      <ellipse cx="0" cy="-15" rx="25" ry="10" fill="#333" stroke="#0f0" stroke-width="2">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
      </ellipse>
      <rect x="-25" y="-15" width="50" height="30" fill="#333" stroke="#0f0" stroke-width="2">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
      </rect>
      <ellipse cx="0" cy="15" rx="25" ry="10" fill="#333" stroke="#0f0" stroke-width="2">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
      </ellipse>
      <text x="0" y="0" font-family="monospace" font-size="8" fill="#0f0" text-anchor="middle">NoSQL</text>
    </g>
    
    <!-- Small Database 3 -->
    <g transform="translate(-100, 80)" filter="url(#glow)">
      <ellipse cx="0" cy="-15" rx="25" ry="10" fill="#333" stroke="#0f0" stroke-width="2">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
      </ellipse>
      <rect x="-25" y="-15" width="50" height="30" fill="#333" stroke="#0f0" stroke-width="2">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
      </rect>
      <ellipse cx="0" cy="15" rx="25" ry="10" fill="#333" stroke="#0f0" stroke-width="2">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
      </ellipse>
      <text x="0" y="0" font-family="monospace" font-size="8" fill="#0f0" text-anchor="middle">KEY-VAL</text>
    </g>
    
    <!-- Small Database 4 -->
    <g transform="translate(100, 80)" filter="url(#glow)">
      <ellipse cx="0" cy="-15" rx="25" ry="10" fill="#333" stroke="#0f0" stroke-width="2">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
      </ellipse>
      <rect x="-25" y="-15" width="50" height="30" fill="#333" stroke="#0f0" stroke-width="2">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
      </rect>
      <ellipse cx="0" cy="15" rx="25" ry="10" fill="#333" stroke="#0f0" stroke-width="2">
        <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
      </ellipse>
      <text x="0" y="0" font-family="monospace" font-size="8" fill="#0f0" text-anchor="middle">GRAPH</text>
    </g>
  </g>
  
  <!-- Connection Lines -->
  <g>
    <line x1="100" y1="120" x2="200" y2="160" stroke="#0f0" stroke-width="1" stroke-dasharray="5,5" filter="url(#glow)">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="300" y1="120" x2="200" y2="160" stroke="#0f0" stroke-width="1" stroke-dasharray="5,5" filter="url(#glow)">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="100" y1="280" x2="200" y2="240" stroke="#0f0" stroke-width="1" stroke-dasharray="5,5" filter="url(#glow)">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="300" y1="280" x2="200" y2="240" stroke="#0f0" stroke-width="1" stroke-dasharray="5,5" filter="url(#glow)">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </line>
  </g>
  
  <!-- Data flow animation -->
  <g>
    <circle cx="100" cy="120" r="4" fill="#0ff" filter="url(#glow)">
      <animate attributeName="cx" values="100;200" dur="2s" repeatCount="indefinite" />
      <animate attributeName="cy" values="120;160" dur="2s" repeatCount="indefinite" />
      <animate attributeName="r" values="4;2;4" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" />
    </circle>
    
    <circle cx="300" cy="120" r="4" fill="#0ff" filter="url(#glow)">
      <animate attributeName="cx" values="300;200" dur="2s" repeatCount="indefinite" begin="0.5s" />
      <animate attributeName="cy" values="120;160" dur="2s" repeatCount="indefinite" begin="0.5s" />
      <animate attributeName="r" values="4;2;4" dur="2s" repeatCount="indefinite" begin="0.5s" />
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" begin="0.5s" />
    </circle>
    
    <circle cx="100" cy="280" r="4" fill="#0ff" filter="url(#glow)">
      <animate attributeName="cx" values="100;200" dur="2s" repeatCount="indefinite" begin="1s" />
      <animate attributeName="cy" values="280;240" dur="2s" repeatCount="indefinite" begin="1s" />
      <animate attributeName="r" values="4;2;4" dur="2s" repeatCount="indefinite" begin="1s" />
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" begin="1s" />
    </circle>
    
    <circle cx="300" cy="280" r="4" fill="#0ff" filter="url(#glow)">
      <animate attributeName="cx" values="300;200" dur="2s" repeatCount="indefinite" begin="1.5s" />
      <animate attributeName="cy" values="280;240" dur="2s" repeatCount="indefinite" begin="1.5s" />
      <animate attributeName="r" values="4;2;4" dur="2s" repeatCount="indefinite" begin="1.5s" />
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" begin="1.5s" />
    </circle>
  </g>
  
  <!-- Query box -->
  <g transform="translate(200, 320)" filter="url(#glow)">
    <rect x="-120" y="-20" width="240" height="40" rx="5" fill="#333" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="5" font-family="monospace" font-size="12" fill="#0f0" text-anchor="middle">
      <animate attributeName="textContent" values="SELECT * FROM users;INSERT INTO users;UPDATE users SET;DELETE FROM users" dur="8s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </text>
  </g>
  
  <!-- Schema box -->
  <g transform="translate(200, 80)" filter="url(#glow)">
    <rect x="-100" y="-40" width="200" height="80" rx="5" fill="#333" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    
    <!-- Schema content -->
    <text x="-90" y="-20" font-family="monospace" font-size="8" fill="#0f0" text-anchor="start">id: INT PRIMARY KEY</text>
    <text x="-90" y="0" font-family="monospace" font-size="8" fill="#0f0" text-anchor="start">username: VARCHAR(255)</text>
    <text x="-90" y="20" font-family="monospace" font-size="8" fill="#0f0" text-anchor="start">email: VARCHAR(255)</text>
    <text x="-90" y="40" font-family="monospace" font-size="8" fill="#0f0" text-anchor="start">created_at: TIMESTAMP</text>
  </g>
  
  <!-- Title -->
  <text x="200" y="35" font-family="monospace" font-size="16" fill="#0f0" text-anchor="middle" font-weight="bold" filter="url(#glow)">
    <animate attributeName="fill" values="#0f0;#0ff;#f0f;#0f0" dur="8s" repeatCount="indefinite" />
    DATABASE MANAGEMENT SYSTEM
  </text>
  
  <!-- Retro computer frame -->
  <rect x="10" y="10" width="380" height="380" stroke="#0f0" stroke-width="3" fill="none" rx="5">
    <animate attributeName="stroke" values="#0f0;#00f;#f00;#0f0" dur="8s" repeatCount="indefinite" />
  </rect>
  
  <!-- Scanline effect -->
  <rect width="400" height="2" fill="#fff" opacity="0.1">
    <animate attributeName="y" values="0;400;0" dur="10s" repeatCount="indefinite" />
  </rect>
</svg> 