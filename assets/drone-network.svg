<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="100%" stop-color="#222" />
      <animate attributeName="x1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
      <animate attributeName="y1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="gridPattern" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="none" stroke="#0f0" stroke-width="0.5" opacity="0.1" />
      <line x1="0" y1="0" x2="50" y2="50" stroke="#0f0" stroke-width="0.2" opacity="0.1" />
      <line x1="50" y1="0" x2="0" y2="50" stroke="#0f0" stroke-width="0.2" opacity="0.1" />
    </pattern>

    <pattern id="circuitPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none" />
      <circle cx="10" cy="10" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="0" cy="0" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="0" cy="20" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="20" cy="0" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="20" cy="20" r="1" fill="#0f0" opacity="0.1" />
    </pattern>
  </defs>

  <!-- Background with grid -->
  <rect width="400" height="400" fill="url(#bgGradient)" />
  <rect width="400" height="400" fill="url(#gridPattern)" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="10s" repeatCount="indefinite" />
  </rect>
  <rect width="400" height="400" fill="url(#circuitPattern)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="15s" repeatCount="indefinite" />
  </rect>

  <!-- Drone 1 -->
  <g transform="translate(100, 120)" filter="url(#glow)">
    <circle cx="0" cy="0" r="25" fill="#333" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="3s" repeatCount="indefinite" />
      <animate attributeName="cy" values="0;-5;0" dur="2s" repeatCount="indefinite" />
    </circle>
    <!-- Propellers -->
    <line x1="-20" y1="-20" x2="-30" y2="-30" stroke="#0f0" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="0 -25 -25;360 -25 -25" dur="0.5s" repeatCount="indefinite" />
    </line>
    <line x1="20" y1="-20" x2="30" y2="-30" stroke="#0f0" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="0 25 -25;360 25 -25" dur="0.5s" repeatCount="indefinite" />
    </line>
    <line x1="-20" y1="20" x2="-30" y2="30" stroke="#0f0" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="0 -25 25;360 -25 25" dur="0.5s" repeatCount="indefinite" />
    </line>
    <line x1="20" y1="20" x2="30" y2="30" stroke="#0f0" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="0 25 25;360 25 25" dur="0.5s" repeatCount="indefinite" />
    </line>
    <!-- Drone body -->
    <text x="0" y="5" font-family="monospace" font-size="10" fill="#0f0" text-anchor="middle">D1</text>
    <!-- Signal waves -->
    <circle cx="0" cy="0" r="30" fill="none" stroke="#0ff" stroke-width="1" opacity="0">
      <animate attributeName="r" values="30;60;30" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Drone 2 -->
  <g transform="translate(300, 150)" filter="url(#glow)">
    <circle cx="0" cy="0" r="25" fill="#333" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="cy" values="0;-5;0" dur="2.3s" repeatCount="indefinite" />
    </circle>
    <!-- Propellers -->
    <line x1="-20" y1="-20" x2="-30" y2="-30" stroke="#0f0" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="0 -25 -25;360 -25 -25" dur="0.5s" repeatCount="indefinite" />
    </line>
    <line x1="20" y1="-20" x2="30" y2="-30" stroke="#0f0" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="0 25 -25;360 25 -25" dur="0.5s" repeatCount="indefinite" />
    </line>
    <line x1="-20" y1="20" x2="-30" y2="30" stroke="#0f0" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="0 -25 25;360 -25 25" dur="0.5s" repeatCount="indefinite" />
    </line>
    <line x1="20" y1="20" x2="30" y2="30" stroke="#0f0" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="0 25 25;360 25 25" dur="0.5s" repeatCount="indefinite" />
    </line>
    <text x="0" y="5" font-family="monospace" font-size="10" fill="#0f0" text-anchor="middle">D2</text>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#0ff" stroke-width="1" opacity="0">
      <animate attributeName="r" values="30;60;30" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Drone 3 -->
  <g transform="translate(200, 90)" filter="url(#glow)">
    <circle cx="0" cy="0" r="25" fill="#333" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
      <animate attributeName="cy" values="0;-5;0" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <!-- Propellers -->
    <line x1="-20" y1="-20" x2="-30" y2="-30" stroke="#0f0" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="0 -25 -25;360 -25 -25" dur="0.5s" repeatCount="indefinite" />
    </line>
    <line x1="20" y1="-20" x2="30" y2="-30" stroke="#0f0" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="0 25 -25;360 25 -25" dur="0.5s" repeatCount="indefinite" />
    </line>
    <line x1="-20" y1="20" x2="-30" y2="30" stroke="#0f0" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="0 -25 25;360 -25 25" dur="0.5s" repeatCount="indefinite" />
    </line>
    <line x1="20" y1="20" x2="30" y2="30" stroke="#0f0" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="0 25 25;360 25 25" dur="0.5s" repeatCount="indefinite" />
    </line>
    <text x="0" y="5" font-family="monospace" font-size="10" fill="#0f0" text-anchor="middle">D3</text>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#0ff" stroke-width="1" opacity="0">
      <animate attributeName="r" values="30;60;30" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Server -->
  <g transform="translate(200, 300)" filter="url(#glow)">
    <rect x="-60" y="-40" width="120" height="80" rx="5" fill="#333" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    <!-- Server racks -->
    <rect x="-50" y="-30" width="100" height="15" fill="#222" stroke="#0f0" stroke-width="1" />
    <rect x="-50" y="-10" width="100" height="15" fill="#222" stroke="#0f0" stroke-width="1" />
    <rect x="-50" y="10" width="100" height="15" fill="#222" stroke="#0f0" stroke-width="1" />
    <!-- Indicator lights -->
    <circle cx="-40" cy="-22" r="2" fill="#0f0">
      <animate attributeName="fill" values="#0f0;#f00;#0f0" dur="1s" repeatCount="indefinite" />
    </circle>
    <circle cx="-30" cy="-22" r="2" fill="#0f0">
      <animate attributeName="fill" values="#0f0;#f00;#0f0" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="-40" cy="-2" r="2" fill="#0f0">
      <animate attributeName="fill" values="#0f0;#f00;#0f0" dur="1.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="-30" cy="-2" r="2" fill="#0f0">
      <animate attributeName="fill" values="#0f0;#f00;#0f0" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="22" font-family="monospace" font-size="10" fill="#0f0" text-anchor="middle">SERVER</text>
  </g>

  <!-- Data transmission lines -->
  <g stroke="#0ff" stroke-width="1" stroke-dasharray="5,5" filter="url(#glow)">
    <line x1="100" y1="120" x2="200" y2="260">
      <animate attributeName="stroke-dashoffset" values="10;0" dur="1s" repeatCount="indefinite" />
    </line>
    <line x1="300" y1="150" x2="200" y2="260">
      <animate attributeName="stroke-dashoffset" values="10;0" dur="1s" repeatCount="indefinite" />
    </line>
    <line x1="200" y1="90" x2="200" y2="260">
      <animate attributeName="stroke-dashoffset" values="10;0" dur="1s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Data packets -->
  <g>
    <circle cx="100" cy="120" r="3" fill="#f0f" filter="url(#glow)">
      <animate attributeName="cx" values="100;200" dur="2s" repeatCount="indefinite" />
      <animate attributeName="cy" values="120;260" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="300" cy="150" r="3" fill="#ff0" filter="url(#glow)">
      <animate attributeName="cx" values="300;200" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="cy" values="150;260" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="200" cy="90" r="3" fill="#0ff" filter="url(#glow)">
      <animate attributeName="cx" values="200;200" dur="3s" repeatCount="indefinite" />
      <animate attributeName="cy" values="90;260" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Sensor data display -->
  <g transform="translate(70, 250)" filter="url(#glow)">
    <rect x="-55" y="-35" width="110" height="70" rx="5" fill="#333" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="-20" font-family="monospace" font-size="8" fill="#0f0" text-anchor="middle">SENSOR DATA</text>
    <text x="0" y="-5" font-family="monospace" font-size="6" fill="#0f0" text-anchor="middle">
      <animate attributeName="textContent" values="TEMP: 25.3°C;TEMP: 26.1°C;TEMP: 25.8°C" dur="3s" repeatCount="indefinite" />
    </text>
    <text x="0" y="8" font-family="monospace" font-size="6" fill="#0f0" text-anchor="middle">
      <animate attributeName="textContent" values="HUMID: 65%;HUMID: 67%;HUMID: 66%" dur="3s" repeatCount="indefinite" />
    </text>
    <text x="0" y="21" font-family="monospace" font-size="6" fill="#0f0" text-anchor="middle">
      <animate attributeName="textContent" values="ALT: 120m;ALT: 125m;ALT: 122m" dur="3s" repeatCount="indefinite" />
    </text>
  </g>

  <!-- Alert system -->
  <g transform="translate(330, 280)" filter="url(#glow)">
    <rect x="-55" y="-35" width="110" height="70" rx="5" fill="#333" stroke="#f00" stroke-width="2">
      <animate attributeName="stroke" values="#f00;#ff0;#f00" dur="2s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="-20" font-family="monospace" font-size="8" fill="#f00" text-anchor="middle">ANOMALY ALERT</text>
    <text x="0" y="-5" font-family="monospace" font-size="6" fill="#f00" text-anchor="middle">DEVIATION: 3.2σ</text>
    <text x="0" y="8" font-family="monospace" font-size="6" fill="#f00" text-anchor="middle">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite" />
      ALERT STATUS
    </text>
    <circle cx="0" cy="25" r="8" fill="none" stroke="#f00" stroke-width="2">
      <animate attributeName="r" values="5;12;5" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Title -->
  <text x="200" y="35" font-family="monospace" font-size="16" fill="#0f0" text-anchor="middle" font-weight="bold" filter="url(#glow)">
    <animate attributeName="fill" values="#0f0;#0ff;#f0f;#0f0" dur="8s" repeatCount="indefinite" />
    DRONE DATA COLLECTION
  </text>

  <!-- Retro computer frame -->
  <rect x="10" y="10" width="380" height="380" stroke="#0f0" stroke-width="3" fill="none" rx="5">
    <animate attributeName="stroke" values="#0f0;#00f;#f00;#0f0" dur="8s" repeatCount="indefinite" />
  </rect>

  <!-- Scanline effect -->
  <rect width="400" height="2" fill="#fff" opacity="0.1">
    <animate attributeName="y" values="0;400;0" dur="10s" repeatCount="indefinite" />
  </rect>
</svg>
