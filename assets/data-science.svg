<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="100%" stop-color="#222" />
      <animate attributeName="x1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
      <animate attributeName="y1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" stroke="#0f0" stroke-width="0.5" opacity="0.1" />
      <rect width="10" height="10" fill="none" stroke="#0f0" stroke-width="0.2" opacity="0.05" />
    </pattern>
  </defs>
  
  <!-- Background with grid -->
  <rect width="400" height="400" fill="url(#bgGradient)" />
  <rect width="400" height="400" fill="url(#gridPattern)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="10s" repeatCount="indefinite" />
  </rect>
  
  <!-- Chart grid -->
  <g transform="translate(200, 200)">
    <!-- Grid lines -->
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#444" stroke-width="1" />
    <line x1="0" y1="-150" x2="0" y2="150" stroke="#444" stroke-width="1" />
    
    <line x1="-150" y1="-50" x2="150" y2="-50" stroke="#333" stroke-width="1" />
    <line x1="-150" y1="50" x2="150" y2="50" stroke="#333" stroke-width="1" />
    <line x1="-150" y1="-100" x2="150" y2="-100" stroke="#333" stroke-width="1" />
    <line x1="-150" y1="100" x2="150" y2="100" stroke="#333" stroke-width="1" />
    
    <line x1="-50" y1="-150" x2="-50" y2="150" stroke="#333" stroke-width="1" />
    <line x1="50" y1="-150" x2="50" y2="150" stroke="#333" stroke-width="1" />
    <line x1="-100" y1="-150" x2="-100" y2="150" stroke="#333" stroke-width="1" />
    <line x1="100" y1="-150" x2="100" y2="150" stroke="#333" stroke-width="1" />
  </g>
  
  <!-- Stock market line -->
  <g transform="translate(200, 200)" filter="url(#glow)">
    <polyline 
      points="-140,-20 -120,-40 -100,-30 -80,-60 -60,-55 -40,-70 -20,-50 0,-80 20,-75 40,-90 60,-70 80,-100 100,-85 120,-95 140,-80" 
      fill="none" 
      stroke="#0f0" 
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </polyline>
    
    <!-- Animated data point -->
    <circle cx="100" cy="-85" r="5" fill="#0ff">
      <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#0ff;#f0f;#0ff" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Inflation line -->
  <g transform="translate(200, 200)" filter="url(#glow)">
    <polyline 
      points="-140,30 -120,20 -100,40 -80,25 -60,50 -40,45 -20,55 0,30 20,40 40,25 60,35 80,15 100,30 120,10 140,20" 
      fill="none" 
      stroke="#f00" 
      stroke-width="3"
      stroke-dasharray="5,5"
      stroke-linecap="round"
      stroke-linejoin="round">
      <animate attributeName="stroke" values="#f00;#f0f;#f00" dur="4s" repeatCount="indefinite" />
    </polyline>
    
    <!-- Animated data point -->
    <circle cx="60" cy="35" r="5" fill="#f0f">
      <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite" begin="1s" />
      <animate attributeName="fill" values="#f0f;#f00;#f0f" dur="4s" repeatCount="indefinite" begin="1s" />
    </circle>
  </g>
  
  <!-- Axis labels -->
  <g transform="translate(200, 200)">
    <text x="145" y="20" font-family="monospace" font-size="12" fill="#0f0" text-anchor="end">TIME</text>
    <text x="10" y="-140" font-family="monospace" font-size="12" fill="#0f0">VALUE</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(80, 60)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#0f0" stroke-width="3" stroke-linecap="round">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </line>
    <text x="40" y="5" font-family="monospace" font-size="12" fill="#0f0">STOCKS</text>
    
    <line x1="0" y1="20" x2="30" y2="20" stroke="#f00" stroke-width="3" stroke-dasharray="5,5" stroke-linecap="round">
      <animate attributeName="stroke" values="#f00;#f0f;#f00" dur="4s" repeatCount="indefinite" />
    </line>
    <text x="40" y="25" font-family="monospace" font-size="12" fill="#f00">INFLATION</text>
  </g>
  
  <!-- Data analysis box -->
  <g transform="translate(300, 100)">
    <rect x="-60" y="-30" width="120" height="60" stroke="#0f0" stroke-width="2" fill="#333" rx="5">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="-10" font-family="monospace" font-size="10" fill="#0f0" text-anchor="middle">CORRELATION:</text>
    <text x="0" y="15" font-family="monospace" font-size="14" fill="#0ff" text-anchor="middle" filter="url(#glow)">
      <animate attributeName="fill" values="#0ff;#f0f;#0ff" dur="4s" repeatCount="indefinite" />
      0.87
    </text>
  </g>
  
  <!-- Animated calculation sequence -->
  <g transform="translate(300, 300)">
    <rect x="-80" y="-30" width="160" height="60" stroke="#0f0" stroke-width="2" fill="#333" rx="5">
      <animate attributeName="stroke" values="#0f0;#00f;#0f0" dur="6s" repeatCount="indefinite" />
    </rect>
    
    <text x="0" y="-10" font-family="monospace" font-size="10" fill="#0f0" text-anchor="middle">CALCULATING</text>
    <text x="0" y="15" font-family="monospace" font-size="12" fill="#0ff" text-anchor="middle">
      <animate attributeName="textContent" values="LOADING...;PROCESSING.;ANALYZING..;PREDICTING.;COMPLETE!" dur="5s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#0ff;#f0f;#0ff" dur="5s" repeatCount="indefinite" />
    </text>
  </g>
  
  <!-- Scanlines effect -->
  <rect width="400" height="2" fill="#fff" opacity="0.1">
    <animate attributeName="y" values="0;400;0" dur="10s" repeatCount="indefinite" />
  </rect>
  
  <!-- Title -->
  <text x="200" y="35" font-family="monospace" font-size="16" fill="#0f0" text-anchor="middle" font-weight="bold" filter="url(#glow)">
    <animate attributeName="fill" values="#0f0;#0ff;#f0f;#0f0" dur="8s" repeatCount="indefinite" />
    STOCK MARKET ANALYSIS
  </text>
  
  <!-- Retro computer frame -->
  <rect x="10" y="10" width="380" height="380" stroke="#0f0" stroke-width="3" fill="none" rx="5">
    <animate attributeName="stroke" values="#0f0;#00f;#f00;#0f0" dur="8s" repeatCount="indefinite" />
  </rect>
  
  <!-- Data points appearing animation -->
  <g transform="translate(200, 200)">
    <circle cx="-80" cy="-60" r="0" fill="#0ff">
      <animate attributeName="r" values="0;4;4;0" dur="10s" repeatCount="indefinite" begin="1s" />
    </circle>
    <circle cx="-20" cy="-50" r="0" fill="#0ff">
      <animate attributeName="r" values="0;4;4;0" dur="10s" repeatCount="indefinite" begin="2s" />
    </circle>
    <circle cx="40" cy="-90" r="0" fill="#0ff">
      <animate attributeName="r" values="0;4;4;0" dur="10s" repeatCount="indefinite" begin="3s" />
    </circle>
    
    <circle cx="-60" cy="50" r="0" fill="#f0f">
      <animate attributeName="r" values="0;4;4;0" dur="10s" repeatCount="indefinite" begin="4s" />
    </circle>
    <circle cx="20" cy="40" r="0" fill="#f0f">
      <animate attributeName="r" values="0;4;4;0" dur="10s" repeatCount="indefinite" begin="5s" />
    </circle>
    <circle cx="80" cy="15" r="0" fill="#f0f">
      <animate attributeName="r" values="0;4;4;0" dur="10s" repeatCount="indefinite" begin="6s" />
    </circle>
  </g>
</svg> 