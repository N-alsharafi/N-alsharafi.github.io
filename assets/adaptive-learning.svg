<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="100%" stop-color="#222" />
      <animate attributeName="x1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
      <animate attributeName="y1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="gridPattern" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="none" stroke="#0f0" stroke-width="0.5" opacity="0.1" />
      <line x1="0" y1="0" x2="50" y2="50" stroke="#0f0" stroke-width="0.2" opacity="0.1" />
      <line x1="50" y1="0" x2="0" y2="50" stroke="#0f0" stroke-width="0.2" opacity="0.1" />
    </pattern>
    <pattern id="circuitPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none" />
      <circle cx="10" cy="10" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="0" cy="0" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="0" cy="20" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="20" cy="0" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="20" cy="20" r="1" fill="#0f0" opacity="0.1" />
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bgGradient)" />
  <rect width="400" height="400" fill="url(#gridPattern)" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="10s" repeatCount="indefinite" />
  </rect>
  <rect width="400" height="400" fill="url(#circuitPattern)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="15s" repeatCount="indefinite" />
  </rect>
  <g transform="translate(200, 160)" filter="url(#glow)">
    <rect x="-110" y="-50" width="220" height="100" rx="5" fill="#333" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="3s" repeatCount="indefinite" />
    </rect>
    <text x="-85" y="-30" font-family="monospace" font-size="8" fill="#0f0">Pipeline Stage 1</text>
    <rect x="-100" y="-20" width="90" height="25" rx="3" fill="#222" stroke="#0f0" stroke-width="1">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="3s" repeatCount="indefinite" />
    </rect>
    <text x="-55" y="-3" font-family="monospace" font-size="7" fill="#0f0" text-anchor="middle">Bi-Encoder</text>
    <rect x="10" y="-20" width="90" height="25" rx="3" fill="#222" stroke="#0f0" stroke-width="1">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="3s" repeatCount="indefinite" />
    </rect>
    <text x="55" y="-3" font-family="monospace" font-size="7" fill="#0f0" text-anchor="middle">FAISS Index</text>
    <text x="-85" y="15" font-family="monospace" font-size="8" fill="#0ff">Pipeline Stage 2</text>
    <rect x="-100" y="25" width="200" height="25" rx="3" fill="#222" stroke="#0ff" stroke-width="1">
      <animate attributeName="stroke" values="#0ff;#f0f;#0ff" dur="3s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="42" font-family="monospace" font-size="7" fill="#0ff" text-anchor="middle">MMR Multi-Objective Ranking</text>
  </g>
  <g transform="translate(200, 290)" filter="url(#glow)">
    <rect x="-110" y="-40" width="220" height="80" rx="5" fill="#333" stroke="#f0f" stroke-width="2">
      <animate attributeName="stroke" values="#f0f;#0ff;#f0f" dur="3s" repeatCount="indefinite" />
    </rect>
    <text x="-85" y="-20" font-family="monospace" font-size="8" fill="#f0f">Pipeline Stage 3</text>
    <rect x="-100" y="-10" width="200" height="40" rx="3" fill="#222" stroke="#f0f" stroke-width="1">
      <animate attributeName="stroke" values="#f0f;#0ff;#f0f" dur="3s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="5" font-family="monospace" font-size="7" fill="#f0f" text-anchor="middle">LLM Tutor (OpenRouter)</text>
    <text x="0" y="18" font-family="monospace" font-size="7" fill="#f0f" text-anchor="middle">720 Config Benchmark</text>
  </g>
  <g transform="translate(200, 70)" filter="url(#glow)">
    <rect x="-140" y="-25" width="280" height="50" rx="5" fill="#333" stroke="#ff0" stroke-width="2">
      <animate attributeName="stroke" values="#ff0;#0f0;#ff0" dur="4s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="-10" font-family="monospace" font-size="7" fill="#ff0" text-anchor="middle">TURKISH LANGUAGE DATABASE</text>
    <text x="0" y="5" font-family="monospace" font-size="8" fill="#ff0" text-anchor="middle">Multilingual Vector Search</text>
  </g>
  <line x1="200" y1="95" x2="200" y2="110" stroke="#0f0" stroke-width="2" filter="url(#glow)" stroke-dasharray="4,2">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" />
  </line>
  <line x1="200" y1="210" x2="200" y2="250" stroke="#0ff" stroke-width="2" filter="url(#glow)" stroke-dasharray="4,2">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.5s" />
  </line>
  <circle cx="200" cy="105" r="3" fill="#0ff" filter="url(#glow)">
    <animate attributeName="cy" values="95;110" dur="1s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite" />
  </circle>
  <circle cx="200" cy="230" r="3" fill="#f0f" filter="url(#glow)">
    <animate attributeName="cy" values="210;250" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <g transform="translate(80, 160)" filter="url(#glow)">
    <circle cx="0" cy="0" r="2" fill="#0f0">
      <animate attributeName="cx" values="0;30" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>
  <text x="200" y="30" font-family="monospace" font-size="16" fill="#0f0" text-anchor="middle" font-weight="bold" filter="url(#glow)">
    <animate attributeName="fill" values="#0f0;#0ff;#f0f;#0f0" dur="8s" repeatCount="indefinite" />
    ADAPTIVE LEARNING PIPELINE
  </text>
  <text x="200" y="45" font-family="monospace" font-size="10" fill="#0f0" text-anchor="middle" filter="url(#glow)">
    <animate attributeName="fill" values="#0f0;#0ff;#f0f;#0f0" dur="8s" repeatCount="indefinite" />
    NLP RECOMMENDATION ENGINE
  </text>
  <rect x="10" y="10" width="380" height="380" stroke="#0f0" stroke-width="3" fill="none" rx="5">
    <animate attributeName="stroke" values="#0f0;#00f;#f00;#0f0" dur="8s" repeatCount="indefinite" />
  </rect>
  <rect width="400" height="2" fill="#fff" opacity="0.1">
    <animate attributeName="y" values="0;400;0" dur="10s" repeatCount="indefinite" />
  </rect>
</svg>