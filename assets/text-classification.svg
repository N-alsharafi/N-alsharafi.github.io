<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="100%" stop-color="#222" />
      <animate attributeName="x1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
      <animate attributeName="y1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <pattern id="gridPattern" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="none" stroke="#0f0" stroke-width="0.5" opacity="0.1" />
      <line x1="0" y1="0" x2="50" y2="50" stroke="#0f0" stroke-width="0.2" opacity="0.1" />
      <line x1="50" y1="0" x2="0" y2="50" stroke="#0f0" stroke-width="0.2" opacity="0.1" />
    </pattern>
  </defs>

  <!-- Background with grid -->
  <rect width="400" height="400" fill="url(#bgGradient)" />
  <rect width="400" height="400" fill="url(#gridPattern)" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="10s" repeatCount="indefinite" />
  </rect>

  <!-- Central Document/Text representation -->
  <g transform="translate(200, 200)" filter="url(#glow)">
    <!-- Document shape -->
    <rect x="-60" y="-80" width="120" height="160" rx="5" fill="#333" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="5s" repeatCount="indefinite" />
    </rect>
    
    <!-- Text lines in document -->
    <line x1="-40" y1="-60" x2="40" y2="-60" stroke="#0f0" stroke-width="2" opacity="0.7">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite" />
    </line>
    <line x1="-40" y1="-40" x2="40" y2="-40" stroke="#0f0" stroke-width="2" opacity="0.7">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.5s" repeatCount="indefinite" />
    </line>
    <line x1="-40" y1="-20" x2="30" y2="-20" stroke="#0f0" stroke-width="2" opacity="0.7">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#0f0" stroke-width="2" opacity="0.7">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4.5s" repeatCount="indefinite" />
    </line>
    <line x1="-40" y1="20" x2="35" y2="20" stroke="#0f0" stroke-width="2" opacity="0.7">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="5s" repeatCount="indefinite" />
    </line>
    <line x1="-40" y1="40" x2="40" y2="40" stroke="#0f0" stroke-width="2" opacity="0.7">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="5.5s" repeatCount="indefinite" />
    </line>
    <line x1="-40" y1="60" x2="25" y2="60" stroke="#0f0" stroke-width="2" opacity="0.7">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="6s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Classification labels around the document -->
  <!-- Label 1: Positive -->
  <g transform="translate(80, 100)" filter="url(#glow)">
    <rect x="-40" y="-15" width="80" height="30" rx="8" fill="#333" stroke="#0f0" stroke-width="1.5">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#333;#224422;#333" dur="4s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="5" font-family="monospace" font-size="10" text-anchor="middle" fill="#0f0" font-weight="bold">
      <animate attributeName="fill" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
      POSITIVE
    </text>
  </g>

  <!-- Label 2: Negative -->
  <g transform="translate(320, 100)" filter="url(#glow)">
    <rect x="-40" y="-15" width="80" height="30" rx="8" fill="#333" stroke="#f00" stroke-width="1.5">
      <animate attributeName="stroke" values="#f00;#ff0;#f00" dur="4.5s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#333;#442222;#333" dur="4.5s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="5" font-family="monospace" font-size="10" text-anchor="middle" fill="#f00" font-weight="bold">
      <animate attributeName="fill" values="#f00;#ff0;#f00" dur="4.5s" repeatCount="indefinite" />
      NEGATIVE
    </text>
  </g>

  <!-- Label 3: Neutral -->
  <g transform="translate(80, 300)" filter="url(#glow)">
    <rect x="-40" y="-15" width="80" height="30" rx="8" fill="#333" stroke="#ff0" stroke-width="1.5">
      <animate attributeName="stroke" values="#ff0;#0ff;#ff0" dur="5s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#333;#444422;#333" dur="5s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="5" font-family="monospace" font-size="10" text-anchor="middle" fill="#ff0" font-weight="bold">
      <animate attributeName="fill" values="#ff0;#0ff;#ff0" dur="5s" repeatCount="indefinite" />
      NEUTRAL
    </text>
  </g>

  <!-- Label 4: Polarized -->
  <g transform="translate(320, 300)" filter="url(#glow)">
    <rect x="-40" y="-15" width="80" height="30" rx="8" fill="#333" stroke="#f0f" stroke-width="1.5">
      <animate attributeName="stroke" values="#f0f;#0ff;#f0f" dur="5.5s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#333;#442244;#333" dur="5.5s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="5" font-family="monospace" font-size="9" text-anchor="middle" fill="#f0f" font-weight="bold">
      <animate attributeName="fill" values="#f0f;#0ff;#f0f" dur="5.5s" repeatCount="indefinite" />
      POLARIZED
    </text>
  </g>

  <!-- Connection lines from document to labels -->
  <g opacity="0.6">
    <line x1="170" y1="140" x2="80" y2="100" stroke="#0f0" stroke-width="1.5">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite" />
    </line>
    <line x1="230" y1="140" x2="320" y2="100" stroke="#f00" stroke-width="1.5">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.5s" repeatCount="indefinite" />
    </line>
    <line x1="170" y1="260" x2="80" y2="300" stroke="#ff0" stroke-width="1.5">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="230" y1="260" x2="320" y2="300" stroke="#f0f" stroke-width="1.5">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4.5s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Data particles flowing from document to labels -->
  <g>
    <circle cx="200" cy="200" r="3" fill="#0ff" filter="url(#glow)">
      <animate attributeName="cx" values="200;80" dur="3s" repeatCount="indefinite" />
      <animate attributeName="cy" values="200;100" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0" dur="3s" repeatCount="indefinite" />
    </circle>
    
    <circle cx="200" cy="200" r="3" fill="#f00" filter="url(#glow)">
      <animate attributeName="cx" values="200;320" dur="3s" repeatCount="indefinite" begin="0.5s" />
      <animate attributeName="cy" values="200;100" dur="3s" repeatCount="indefinite" begin="0.5s" />
      <animate attributeName="opacity" values="1;0" dur="3s" repeatCount="indefinite" begin="0.5s" />
    </circle>
    
    <circle cx="200" cy="200" r="3" fill="#ff0" filter="url(#glow)">
      <animate attributeName="cx" values="200;80" dur="3s" repeatCount="indefinite" begin="1s" />
      <animate attributeName="cy" values="200;300" dur="3s" repeatCount="indefinite" begin="1s" />
      <animate attributeName="opacity" values="1;0" dur="3s" repeatCount="indefinite" begin="1s" />
    </circle>
    
    <circle cx="200" cy="200" r="3" fill="#f0f" filter="url(#glow)">
      <animate attributeName="cx" values="200;320" dur="3s" repeatCount="indefinite" begin="1.5s" />
      <animate attributeName="cy" values="200;300" dur="3s" repeatCount="indefinite" begin="1.5s" />
      <animate attributeName="opacity" values="1;0" dur="3s" repeatCount="indefinite" begin="1.5s" />
    </circle>
  </g>

  <!-- Arabic text indicator -->
  <g transform="translate(200, 60)" filter="url(#glow)">
    <text x="0" y="0" font-family="monospace" font-size="12" text-anchor="middle" fill="#0ff" font-weight="bold">
      <animate attributeName="fill" values="#0ff;#0f0;#0ff" dur="4s" repeatCount="indefinite" />
      عربي | ARABIC NLP
    </text>
  </g>

  <!-- Top Title -->
  <text x="200" y="35" font-family="monospace" font-size="14" fill="#0f0" text-anchor="middle" font-weight="bold" filter="url(#glow)">
    <animate attributeName="fill" values="#0f0;#0ff;#f0f;#0f0" dur="8s" repeatCount="indefinite" />
    MULTILINGUAL TEXT CLASSIFICATION
  </text>

  <!-- Bottom Title -->
  <text x="200" y="370" font-family="monospace" font-size="14" fill="#0f0" text-anchor="middle" font-weight="bold" filter="url(#glow)">
    <animate attributeName="fill" values="#0f0;#0ff;#f0f;#0f0" dur="8s" repeatCount="indefinite" />
    SEMEVAL 2026 | MARBERT
  </text>

  <!-- Retro computer frame -->
  <rect x="10" y="10" width="380" height="380" stroke="#0f0" stroke-width="3" fill="none" rx="5">
    <animate attributeName="stroke" values="#0f0;#00f;#f00;#0f0" dur="8s" repeatCount="indefinite" />
  </rect>

  <!-- Scanline effect -->
  <rect width="400" height="2" fill="#fff" opacity="0.1">
    <animate attributeName="y" values="0;400;0" dur="10s" repeatCount="indefinite" />
  </rect>
</svg>