<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="100%" stop-color="#222" />
      <animate attributeName="x1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
      <animate attributeName="y1" values="0%;100%;0%" dur="20s" repeatCount="indefinite" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="gridPattern" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="none" stroke="#0f0" stroke-width="0.5" opacity="0.1" />
      <line x1="0" y1="0" x2="50" y2="50" stroke="#0f0" stroke-width="0.2" opacity="0.1" />
      <line x1="50" y1="0" x2="0" y2="50" stroke="#0f0" stroke-width="0.2" opacity="0.1" />
    </pattern>

    <pattern id="circuitPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none" />
      <circle cx="10" cy="10" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="0" cy="0" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="0" cy="20" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="20" cy="0" r="1" fill="#0f0" opacity="0.1" />
      <circle cx="20" cy="20" r="1" fill="#0f0" opacity="0.1" />
    </pattern>
  </defs>

  <!-- Background with grid -->
  <rect width="400" height="400" fill="url(#bgGradient)" />
  <rect width="400" height="400" fill="url(#gridPattern)" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="10s" repeatCount="indefinite" />
  </rect>
  <rect width="400" height="400" fill="url(#circuitPattern)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="15s" repeatCount="indefinite" />
  </rect>

  <!-- User Profile (left side) -->
  <g transform="translate(80, 200)" filter="url(#glow)">
    <rect x="-60" y="-100" width="120" height="200" rx="5" fill="#333" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="-85" font-family="monospace" font-size="9" fill="#0f0" text-anchor="middle">USER PROFILE</text>

    <!-- Profile picture placeholder -->
    <circle cx="0" cy="-55" r="18" fill="#222" stroke="#0f0" stroke-width="1.5" />
    <circle cx="0" cy="-60" r="8" fill="#0f0" opacity="0.5" />
    <path d="M -12,-42 C -12,-52 12,-52 12,-42" fill="none" stroke="#0f0" stroke-width="1.5" />

    <!-- Profile info lines -->
    <line x1="-45" y1="-25" x2="45" y2="-25" stroke="#0f0" stroke-width="1" />
    <line x1="-45" y1="-15" x2="30" y2="-15" stroke="#0f0" stroke-width="1" />
    <line x1="-45" y1="-5" x2="40" y2="-5" stroke="#0f0" stroke-width="1" />

    <!-- Skills section -->
    <text x="0" y="15" font-family="monospace" font-size="7" fill="#0f0" text-anchor="middle">SKILLS</text>
    <rect x="-40" y="20" width="80" height="8" fill="#222" stroke="#0f0" stroke-width="0.5" />
    <rect x="-40" y="20" width="60" height="8" fill="#0f0" opacity="0.5" />
    <rect x="-40" y="32" width="80" height="8" fill="#222" stroke="#0f0" stroke-width="0.5" />
    <rect x="-40" y="32" width="70" height="8" fill="#0f0" opacity="0.5" />
    <rect x="-40" y="44" width="80" height="8" fill="#222" stroke="#0f0" stroke-width="0.5" />
    <rect x="-40" y="44" width="55" height="8" fill="#0f0" opacity="0.5" />

    <!-- Experience section -->
    <text x="0" y="68" font-family="monospace" font-size="7" fill="#0f0" text-anchor="middle">EXPERIENCE</text>
    <line x1="-45" y1="75" x2="45" y2="75" stroke="#0f0" stroke-width="0.5" />
    <line x1="-45" y1="82" x2="35" y2="82" stroke="#0f0" stroke-width="0.5" />
    <line x1="-45" y1="89" x2="40" y2="89" stroke="#0f0" stroke-width="0.5" />
  </g>

  <!-- Job Description (top right) -->
  <g transform="translate(290, 90)" filter="url(#glow)">
    <rect x="-70" y="-40" width="140" height="80" rx="5" fill="#333" stroke="#ff0" stroke-width="2">
      <animate attributeName="stroke" values="#ff0;#f00;#ff0" dur="4s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="-25" font-family="monospace" font-size="9" fill="#ff0" text-anchor="middle">JOB DESCRIPTION</text>

    <!-- Job requirements -->
    <text x="-55" y="-8" font-family="monospace" font-size="5" fill="#ff0">• Python Expert</text>
    <text x="-55" y="2" font-family="monospace" font-size="5" fill="#ff0">• 5+ Years Exp</text>
    <text x="-55" y="12" font-family="monospace" font-size="5" fill="#ff0">• Machine Learning</text>
    <text x="-55" y="22" font-family="monospace" font-size="5" fill="#ff0">• Team Leadership</text>
  </g>

  <!-- AI Enhancement Engine (center) -->
  <g transform="translate(200, 200)" filter="url(#glow)">
    <!-- AI brain -->
    <ellipse cx="0" cy="0" rx="50" ry="40" fill="#333" stroke="#0ff" stroke-width="3">
      <animate attributeName="stroke" values="#0ff;#f0f;#0ff" dur="3s" repeatCount="indefinite" />
    </ellipse>

    <!-- Neural connections -->
    <g stroke="#0ff" stroke-width="1" opacity="0.6">
      <line x1="-35" y1="-20" x2="35" y2="20">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite" />
      </line>
      <line x1="-35" y1="0" x2="35" y2="0">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.3s" repeatCount="indefinite" />
      </line>
      <line x1="35" y1="-20" x2="-35" y2="20">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.6s" repeatCount="indefinite" />
      </line>
    </g>

    <!-- Neurons -->
    <circle cx="-35" cy="-20" r="3" fill="#0ff">
      <animate attributeName="r" values="2;4;2" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="35" cy="-20" r="3" fill="#0ff">
      <animate attributeName="r" values="2;4;2" dur="1.7s" repeatCount="indefinite" />
    </circle>
    <circle cx="-35" cy="20" r="3" fill="#0ff">
      <animate attributeName="r" values="2;4;2" dur="1.9s" repeatCount="indefinite" />
    </circle>
    <circle cx="35" cy="20" r="3" fill="#0ff">
      <animate attributeName="r" values="2;4;2" dur="2.1s" repeatCount="indefinite" />
    </circle>

    <text x="0" y="5" font-family="monospace" font-size="10" fill="#0ff" text-anchor="middle">AI</text>
    <text x="0" y="-35" font-family="monospace" font-size="8" fill="#0ff" text-anchor="middle">ENHANCEMENT</text>

    <!-- Processing indicator -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#0ff" stroke-width="1" opacity="0">
      <animate attributeName="r" values="50;70;50" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Generated CV (right side) -->
  <g transform="translate(320, 280)" filter="url(#glow)">
    <rect x="-60" y="-100" width="120" height="200" rx="5" fill="#333" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="-85" font-family="monospace" font-size="9" fill="#0f0" text-anchor="middle">TAILORED CV</text>

    <!-- Enhanced content -->
    <rect x="-50" y="-70" width="100" height="160" fill="#222" stroke="#0f0" stroke-width="1" />

    <!-- Header -->
    <line x1="-45" y1="-60" x2="45" y2="-60" stroke="#0ff" stroke-width="2" />
    <line x1="-45" y1="-53" x2="30" y2="-53" stroke="#0ff" stroke-width="1" />

    <!-- Content sections with animation -->
    <g>
      <rect x="-45" y="-40" width="85" height="3" fill="#0f0" opacity="0.7" />
      <rect x="-45" y="-35" width="75" height="2" fill="#0f0" opacity="0.5" />
      <rect x="-45" y="-31" width="80" height="2" fill="#0f0" opacity="0.5" />

      <rect x="-45" y="-20" width="85" height="3" fill="#0ff" opacity="0.7" />
      <rect x="-45" y="-15" width="70" height="2" fill="#0ff" opacity="0.5" />
      <rect x="-45" y="-11" width="82" height="2" fill="#0ff" opacity="0.5" />

      <rect x="-45" y="0" width="85" height="3" fill="#0f0" opacity="0.7" />
      <rect x="-45" y="5" width="77" height="2" fill="#0f0" opacity="0.5" />
      <rect x="-45" y="9" width="68" height="2" fill="#0f0" opacity="0.5" />

      <!-- Highlight optimized keywords -->
      <rect x="-45" y="22" width="30" height="5" fill="#ff0" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite" />
      </rect>
      <rect x="10" y="35" width="35" height="5" fill="#ff0" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2.3s" repeatCount="indefinite" />
      </rect>
      <rect x="-30" y="48" width="40" height="5" fill="#ff0" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2.6s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Quality badge -->
    <circle cx="35" cy="75" r="12" fill="#333" stroke="#0ff" stroke-width="2">
      <animate attributeName="stroke" values="#0ff;#0f0;#0ff" dur="3s" repeatCount="indefinite" />
    </circle>
    <text x="35" y="78" font-family="monospace" font-size="8" fill="#0ff" text-anchor="middle">✓</text>
  </g>

  <!-- Data flow arrows -->
  <g stroke="#0ff" stroke-width="2" fill="none" filter="url(#glow)">
    <!-- Profile to AI -->
    <path d="M 140,200 L 150,200" stroke-dasharray="5,3">
      <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" repeatCount="indefinite" />
    </path>
    <polygon points="150,200 145,197 145,203" fill="#0ff" />

    <!-- Job description to AI -->
    <path d="M 250,130 L 220,170" stroke-dasharray="5,3" stroke="#ff0">
      <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" repeatCount="indefinite" />
    </path>
    <polygon points="220,170 223,165 217,165" fill="#ff0" />

    <!-- AI to CV -->
    <path d="M 250,200 L 260,240" stroke-dasharray="5,3">
      <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" repeatCount="indefinite" />
    </path>
    <polygon points="260,240 257,235 263,235" fill="#0ff" />
  </g>

  <!-- Data packets animation -->
  <circle cx="140" cy="200" r="3" fill="#f0f" filter="url(#glow)">
    <animate attributeName="cx" values="140;200" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <circle cx="250" cy="130" r="3" fill="#ff0" filter="url(#glow)">
    <animate attributeName="cx" values="250;220" dur="1.8s" repeatCount="indefinite" />
    <animate attributeName="cy" values="130;170" dur="1.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0" dur="1.8s" repeatCount="indefinite" />
  </circle>

  <circle cx="250" cy="200" r="3" fill="#0ff" filter="url(#glow)">
    <animate attributeName="cx" values="250;260" dur="2s" repeatCount="indefinite" />
    <animate attributeName="cy" values="200;240" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Features box -->
  <g transform="translate(200, 370)" filter="url(#glow)">
    <rect x="-100" y="-25" width="200" height="50" rx="5" fill="#333" stroke="#0f0" stroke-width="2">
      <animate attributeName="stroke" values="#0f0;#0ff;#0f0" dur="4s" repeatCount="indefinite" />
    </rect>
    <text x="-80" y="-8" font-family="monospace" font-size="6" fill="#0f0">• Drag & Drop</text>
    <text x="-80" y="2" font-family="monospace" font-size="6" fill="#0f0">• AI Tailoring</text>
    <text x="-80" y="12" font-family="monospace" font-size="6" fill="#0f0">• One Profile</text>

    <text x="20" y="-8" font-family="monospace" font-size="6" fill="#0f0">• CV Parser</text>
    <text x="20" y="2" font-family="monospace" font-size="6" fill="#0f0">• Quick Export</text>
    <text x="20" y="12" font-family="monospace" font-size="6" fill="#0f0">• 8-day Build</text>
  </g>

  <!-- Title -->
  <text x="200" y="30" font-family="monospace" font-size="16" fill="#0f0" text-anchor="middle" font-weight="bold" filter="url(#glow)">
    <animate attributeName="fill" values="#0f0;#0ff;#f0f;#0f0" dur="8s" repeatCount="indefinite" />
    WITCHCRAFT CV BUILDER
  </text>
  <text x="200" y="45" font-family="monospace" font-size="9" fill="#0f0" text-anchor="middle" filter="url(#glow)">
    <animate attributeName="fill" values="#0f0;#0ff;#f0f;#0f0" dur="8s" repeatCount="indefinite" />
    AI-POWERED RESUME TOOL
  </text>

  <!-- Retro computer frame -->
  <rect x="10" y="10" width="380" height="380" stroke="#0f0" stroke-width="3" fill="none" rx="5">
    <animate attributeName="stroke" values="#0f0;#00f;#f00;#0f0" dur="8s" repeatCount="indefinite" />
  </rect>

  <!-- Scanline effect -->
  <rect width="400" height="2" fill="#fff" opacity="0.1">
    <animate attributeName="y" values="0;400;0" dur="10s" repeatCount="indefinite" />
  </rect>
</svg>
