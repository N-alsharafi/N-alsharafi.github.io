    <script>
      // Apply the stored theme before first paint so dark mode never flashes.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {
          /* storage unavailable: fall through to the light default */
        }
      })();

      // Links shared from the previous multi-page build still land somewhere useful.
      (function () {
        var routes = { "#/experience": "#archive", "#/contact": "#contact" };
        var target = routes[location.hash];
        if (target) history.replaceState(null, "", "./" + target);
      })();
    </script>
